<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitBud - 自動版本清單</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 { margin-bottom: 10px; font-size: 24px; color: #2c3e50; }
        p { color: #7f8c8d; margin-bottom: 20px; font-size: 14px; }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 250px;
            overflow-y: auto;
            text-align: left;
        }
        .btn {
            display: block;
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: #2980b9; }
        .loading { color: #95a5a6; font-style: italic; }
    </style>
</head>
<body>

    <div class="container">
        <h1>GitBud 版本清單</h1>
        <p>以下為自動偵測到的所有版本：</p>
        
        <div id="version-list" class="btn-group">
            <span class="loading">正在載入版本清單...</span>
        </div>
    </div>

    <script>
        // 替換成你的 GitHub 使用者名稱與專案名稱
        const username = "YOUR_USERNAME";
        const repo = "gitbud";

        async function fetchVersions() {
            const listContainer = document.getElementById("version-list");
            try {
                const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/`);
                const files = await response.json();
                
                listContainer.innerHTML = ""; // 清除載入中文字

                // 過濾出 .html 檔案，且排除 index.html 本身
                const htmlFiles = files.filter(file => 
                    file.name.endsWith(".html") && file.name.toLowerCase() !== "index.html"
                );

                if (htmlFiles.length === 0) {
                    listContainer.innerHTML = "<p style='text-align:center;'>找不到其他版本檔案。</p>";
                    return;
                }

                htmlFiles.forEach(file => {
                    const a = document.createElement("a");
                    a.href = file.name;
                    a.className = "btn";
                    // 移除副檔名作為按鈕顯示名稱（例如 NewVer.html 顯示為 NewVer）
                    a.textContent = file.name.replace(/\.html$/i, ""); 
                    listContainer.appendChild(a);
                });

            } catch (error) {
                listContainer.innerHTML = "<p style='color: red; text-align:center;'>無法自動載入版本清單，請檢查網路或設定。</p>";
            }
        }

        fetchVersions();
    </script>

</body>
</html>
