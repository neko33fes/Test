<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IC 即時檢測 App (寬間距單紅虛線版)</title>
    <!-- 引入 Tesseract.js 文字辨識庫 -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #121212; 
            color: #fff; 
            text-align: center; 
            margin: 0; 
            padding: 10px; 
        }
        h2 { margin: 10px 0; font-size: 22px; }
        .input-group { margin: 8px 0; }
        input { 
            padding: 10px; 
            font-size: 18px; 
            width: 80%; 
            max-width: 300px; 
            border-radius: 6px; 
            border: 1px solid #444; 
            background: #222; 
            color: #fff; 
            text-align: center; 
        }

        /* 相機預覽框 */
        .video-container { 
            position: relative; 
            width: 100%; 
            max-width: 400px; 
            height: 240px; 
            margin: 10px auto; 
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #444;
            background: #000;
            cursor: pointer;
        }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
        }
        canvas { display: none; }
        
        /* 正中水平單紅虛線：貼邊，並使用 background 調整虛線間距（拉開空白間隔） */
        .scan-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            transform: translateY(-50%);
            pointer-events: none;
            z-index: 10;
            /* 透過漸層背景自訂寬虛線：紅線寬 12px，空白間距 12px */
            background: repeating-linear-gradient(
                to right,
                #ff1744,
                #ff1744 12px,
                transparent 12px,
                transparent 24px
            );
        }

        /* 狀態看板樣式 */
        .status-box { 
            margin: 15px auto; 
            padding: 18px; 
            max-width: 400px; 
            font-size: 24px; 
            font-weight: bold; 
            border-radius: 10px; 
            transition: 0.3s; 
        }
        .pending { background: #ef6c00; color: #fff; }
        .pass { background: #2e7d32; color: #fff; }
        .fail { background: #c62828; color: #fff; }
        p { font-size: 13px; color: #aaa; margin: 6px 0; }
    </style>
</head>
<body>

    <h2>IC 即時檢測系統</h2>
    
    <div class="input-group">
        <label>預期型號：</label><br>
        <input type="text" id="expectedText" value="NE5532P">
    </div>

    <!-- 相機與寬間距單紅虛線對齊 -->
    <div class="video-container" id="videoContainer">
        <video id="video" autoplay playsinline muted></video>
        <div class="scan-line"></div>
    </div>
    <canvas id="canvas"></canvas>

    <!-- 狀態顯示 -->
    <div id="statusBox" class="status-box pending">正在載入 AI 辨識引擎...</div>
    <p id="detectedText">識別文字：無</p>
    <p>（請將 IC 字體對齊紅色虛線，系統將自動背景辨識並顯示 PASS/FAIL）</p>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusBox = document.getElementById('statusBox');
        const expectedInput = document.getElementById('expectedText');
        const videoContainer = document.getElementById('videoContainer');
        const detectedTextEl = document.getElementById('detectedText');

        let videoTrack = null;
        let worker = null;
        let isProcessing = false;

        // 初始化 Tesseract AI 辨識引擎
        async function initOCR() {
            try {
                statusBox.innerText = "載入辨識模型中 (初次稍候)...";
                worker = await Tesseract.createWorker('eng');
                statusBox.className = "status-box pending";
                statusBox.innerText = "引擎就緒，請對準 IC";
                startCamera();
            } catch (err) {
                statusBox.innerText = "辨識引擎載入失敗";
            }
        }

        // 啟動手機相機
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: { exact: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        focusMode: "continuous"
                    }
                }).catch(() => {
                    return navigator.mediaDevices.getUserMedia({ video: true });
                });

                video.srcObject = stream;
                video.play();
                
                videoTrack = stream.getVideoTracks()[0];
                await applyFastFocusSettings(videoTrack);

                // 點擊畫面任意處觸發極速手動對焦
                videoContainer.addEventListener('click', () => triggerFastManualFocus());

                // 每 2 秒自動抓取紅線周圍的影像進行背景辨識
                setInterval(processFrame, 2000);
            } catch (err) {
                alert("無法開啟相機，請檢查瀏覽器權限或確認是否使用 HTTPS/Localhost！");
                statusBox.innerText = "相機開啟失敗";
            }
        }

        // 核心：精準裁切紅線周圍（全寬、高 40px 的水平橫條）進行辨識
        async function processFrame() {
            if (!worker || isProcessing || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            
            isProcessing = true;

            try {
                const vWidth = video.videoWidth;
                const vHeight = video.videoHeight;

                const boxW = vWidth; 
                const boxH = 40 * (vHeight / videoContainer.clientHeight); 
                const boxX = 0;
                const boxY = (vHeight - boxH) / 2;

                canvas.width = boxW * 2;
                canvas.height = boxH * 2;
                const ctx = canvas.getContext('2d');

                ctx.drawImage(video, boxX, boxY, boxW, boxH, 0, 0, canvas.width, canvas.height);

                // 執行辨識
                const { data: { text } } = await worker.recognize(canvas);
                const cleanText = text.replace(/\s+/g, ' ').trim();
                
                if (cleanText) {
                    detectedTextEl.innerText = "識別文字：" + cleanText;
                } else {
                    detectedTextEl.innerText = "識別文字：(尋找中...)";
                }

                const expected = expectedInput.value.trim().toUpperCase();
                
                // 比對結果判定 PASS / FAIL
                if (expected && cleanText.toUpperCase().includes(expected)) {
                    statusBox.className = "status-box pass";
                    statusBox.innerText = "【 PASS 】型號相符";
                } else {
                    statusBox.className = "status-box fail";
                    statusBox.innerText = "【 FAIL 】型號不符";
                }
            } catch (error) {
                console.error(error);
            } finally {
                isProcessing = false;
            }
        }

        // 相機自動對焦微距設定
        async function applyFastFocusSettings(track) {
            try {
                const capabilities = track.getCapabilities();
                let advancedSettings = {};

                if (capabilities.focusMode) {
                    if (capabilities.focusMode.includes('continuous')) {
                        advancedSettings.focusMode = 'continuous';
                    } else if (capabilities.focusMode.includes('macro')) {
                        advancedSettings.focusMode = 'macro';
                    }
                }

                if (capabilities.exposureCompensation) {
                    advancedSettings.exposureCompensation = 0; 
                }

                if (Object.keys(advancedSettings).length > 0) {
                    await track.applyConstraints({ advanced: [advancedSettings] });
                }
            } catch (err) {
                console.log("硬體不支援進階對焦約束", err);
            }
        }

        // 點擊畫面單次極速對焦
        async function triggerFastManualFocus() {
            if (!videoTrack) return;
            try {
                const capabilities = videoTrack.getCapabilities();
                if (capabilities.focusMode && capabilities.focusMode.includes('single-shot')) {
                    await videoTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
                    setTimeout(async () => {
                        await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                    }, 1000);
                }
            } catch (err) {
                console.log("手動極速對焦觸發受限", err);
            }
        }

        window.onload = initOCR;
    </script>
</body>
</html>
