<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>文字比對系統</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            background: #121212; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            box-sizing: border-box;
        }
        
        .wrapper {
            width: 100%;
            max-width: 400px;
            height: 100%;
            margin: 0 auto;
            box-sizing: border-box;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        h2 { 
            margin: 0; 
            font-size: 18px; 
            flex-shrink: 0;
        }

        .input-group { 
            width: 100%; 
            flex-shrink: 0;
        }
        input[type="text"] { 
            padding: 10px; 
            font-size: 16px; 
            width: 100%; 
            box-sizing: border-box; 
            border-radius: 10px; 
            border: 2px solid #444; 
            background: #222; 
            color: #fff; 
            text-align: center; 
        }
        input[type="text"]::placeholder {
            color: #777;
        }

        .video-container { 
            position: relative; 
            width: 100%; 
            flex: 1; 
            min-height: 200px;
            margin: 8px 0; 
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #444;
            background: #000;
            cursor: pointer;
            box-sizing: border-box;
        }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
        }
        canvas { display: none; }
        .scan-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            transform: translateY(-50%);
            pointer-events: none;
            z-index: 10;
            background: repeating-linear-gradient(
                to right,
                #ff1744,
                #ff1744 12px,
                transparent 12px,
                transparent 24px
            );
        }
        .status-box { 
            padding: 12px; 
            width: 100%;
            font-size: 20px; 
            font-weight: bold; 
            border-radius: 10px; 
            transition: 0.3s; 
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .pending { background: #ef6c00; color: #fff; }
        .pass { background: #2e7d32; color: #fff; }
        .fail { background: #c62828; color: #fff; }

        .info-area {
            flex-shrink: 0;
            width: 100%;
        }
        .info-text { 
            font-size: 12px; 
            color: #aaa; 
            margin: 2px 0; 
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <h2>文字比對系統</h2>
        
        <div class="input-group">
            <input type="text" id="expectedText" placeholder="請輸入確認文字" value="">
        </div>

        <div class="video-container" id="videoContainer">
            <video id="video" autoplay playsinline muted></video>
            <div class="scan-line"></div>
        </div>
        <canvas id="canvas"></canvas>

        <div id="statusBox" class="status-box pending">正在載入模型...</div>
        
        <div class="info-area">
            <p id="detectedText" class="info-text">識別文字：無</p>
            <p class="info-text">（請將目標文字對準紅線，點擊畫面可手動對焦）</p>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusBox = document.getElementById('statusBox');
        const expectedInput = document.getElementById('expectedText');
        const videoContainer = document.getElementById('videoContainer');
        const detectedTextEl = document.getElementById('detectedText');

        let videoTrack = null;
        let worker = null;
        let isProcessing = false;

        async function initOCR() {
            try {
                statusBox.innerText = "載入中英文字型模型中...";
                worker = await Tesseract.createWorker(['eng', 'chi_tra']);

                statusBox.className = "status-box pending";
                statusBox.innerText = "引擎就緒，請輸入確認文字";
                startCamera();
            } catch (err) {
                statusBox.innerText = "引擎載入失敗";
                console.error(err);
            }
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: { exact: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                }).catch(() => navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }));

                video.srcObject = stream;
                video.play();
                
                videoTrack = stream.getVideoTracks()[0];
                
                try {
                    const caps = videoTrack.getCapabilities();
                    if (caps.focusMode && caps.focusMode.includes('continuous')) {
                        await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                    }
                } catch (e) {}

                videoContainer.addEventListener('click', triggerManualFocus);
                setInterval(processFrame, 2000);
            } catch (err) {
                statusBox.innerText = "相機開啟失敗";
            }
        }

        async function processFrame() {
            if (!worker || isProcessing || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            
            const expected = expectedInput.value.replace(/[\s\r\n]+/g, '').trim().toUpperCase();
            if (!expected) {
                statusBox.className = "status-box pending";
                statusBox.innerText = "請於上方輸入確認文字";
                detectedTextEl.innerText = "識別文字：等待輸入...";
                return;
            }

            isProcessing = true;

            try {
                const vW = video.videoWidth;
                const vH = video.videoHeight;
                const cH = videoContainer.clientHeight;
                
                const boxW = vW * 0.9;
                const boxH = (cH * 0.35) * (vH / cH);
                const boxX = (vW - boxW) / 2;
                const boxY = (vH - boxH) / 2;

                canvas.width = boxW;
                canvas.height = boxH;
                const ctx = canvas.getContext('2d');

                ctx.drawImage(video, boxX, boxY, boxW, boxH, 0, 0, boxW, boxH);

                let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    let avg = (data[i] * 0.3 + data[i + 1] * 0.59 + data[i + 2] * 0.11);
                    let val = avg < 120 ? 0 : 255;
                    data[i] = data[i+1] = data[i+2] = val;
                }
                ctx.putImageData(imgData, 0, 0);

                const { data: { text } } = await worker.recognize(canvas);
                const cleanText = text.replace(/[\s\r\n]+/g, '').trim();
                
                detectedTextEl.innerText = cleanText ? "識別文字：" + cleanText : "識別文字：(尋找中...)";

                const actual = cleanText.toUpperCase();

                if (actual.includes(expected)) {
                    statusBox.className = "status-box pass";
                    statusBox.innerText = "【 PASS 】文字相符";
                } else {
                    statusBox.className = "status-box fail";
                    statusBox.innerText = "【 FAIL 】文字不符";
                }
            } catch (error) {
                console.error(error);
            } finally {
                isProcessing = false;
            }
        }

        async function triggerManualFocus() {
            if (!videoTrack) return;
            try {
                const caps = videoTrack.getCapabilities();
                if (caps.focusMode && caps.focusMode.includes('single-shot')) {
                    await videoTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
                    setTimeout(async () => {
                        await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                    }, 1000);
                }
            } catch (e) {}
        }

        window.onload = initOCR;
    </script>
</body>
</html>
