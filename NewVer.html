<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中英文字檢測 App (不分大小寫版)</title>
    <!-- 引入 Tesseract.js 文字辨識庫 -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #121212; 
            color: #fff; 
            text-align: center; 
            margin: 0; 
            padding: 10px; 
        }
        h2 { margin: 10px 0; font-size: 20px; }
        .input-group { margin: 8px 0; }
        input[type="text"] { 
            padding: 10px; 
            font-size: 16px; 
            width: 80%; 
            max-width: 300px; 
            border-radius: 6px; 
            border: 1px solid #444; 
            background: #222; 
            color: #fff; 
            text-align: center; 
        }
        .checkbox-group {
            margin: 8px 0;
            font-size: 14px;
            color: #ccc;
            cursor: pointer;
        }
        .checkbox-group input {
            transform: scale(1.2);
            margin-right: 6px;
            cursor: pointer;
        }

        /* 具備響應式適應力的相機預覽框 */
        .video-container { 
            position: relative; 
            width: 100%; 
            max-width: 400px; 
            height: 240px; 
            margin: 10px auto; 
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #444;
            background: #000;
            cursor: pointer;
        }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
        }
        canvas { display: none; }
        
        /* 透過百分比置中對齊的基準紅線 */
        .scan-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            transform: translateY(-50%);
            pointer-events: none;
            z-index: 10;
            background: repeating-linear-gradient(
                to right,
                #ff1744,
                #ff1744 12px,
                transparent 12px,
                transparent 24px
            );
        }

        /* 黃色虛線框 */
        .capture-box {
            position: absolute;
            top: 50%;
            left: 10%;
            right: 10%;
            height: 50px; 
            transform: translateY(-50%);
            border: 2px dashed #ffeb3b; 
            pointer-events: none;
            z-index: 9;
            box-sizing: border-box;
            background-color: rgba(255, 235, 59, 0.05);
            display: none; /* 預設 OFF */
        }

        /* 狀態看板樣式 */
        .status-box { 
            margin: 15px auto; 
            padding: 16px; 
            max-width: 400px; 
            font-size: 22px; 
            font-weight: bold; 
            border-radius: 10px; 
            transition: 0.3s; 
        }
        .pending { background: #ef6c00; color: #fff; }
        .pass { background: #2e7d32; color: #fff; }
        .fail { background: #c62828; color: #fff; }
        p { font-size: 13px; color: #aaa; margin: 6px 0; }
    </style>
</head>
<body>

    <h2>中英文字檢測系統</h2>
    
    <div class="input-group">
        <label>預期文字：</label><br>
        <input type="text" id="expectedText" value="NE5532P">
    </div>

    <!-- 黃框顯示開關 (預設 OFF) -->
    <div class="checkbox-group">
        <label>
            <input type="checkbox" id="showBoxToggle"> 顯示黃色擷取範圍框
        </label>
    </div>

    <!-- 相機與掃描框 -->
    <div class="video-container" id="videoContainer">
        <video id="video" autoplay playsinline muted></video>
        <div class="capture-box" id="captureBox"></div>
        <div class="scan-line"></div>
    </div>
    <canvas id="canvas"></canvas>

    <!-- 狀態顯示 -->
    <div id="statusBox" class="status-box pending">正在載入中英文字型模型...</div>
    <p id="detectedText">識別文字：無</p>
    <p>（請將目標文字對準紅線，點擊畫面可手動觸發對焦）</p>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusBox = document.getElementById('statusBox');
        const expectedInput = document.getElementById('expectedText');
        const videoContainer = document.getElementById('videoContainer');
        const detectedTextEl = document.getElementById('detectedText');
        const showBoxToggle = document.getElementById('showBoxToggle');
        const captureBox = document.getElementById('captureBox');

        let videoTrack = null;
        let worker = null;
        let isProcessing = false;

        // 監聽黃框開關切換
        showBoxToggle.addEventListener('change', (e) => {
            captureBox.style.display = e.target.checked ? 'block' : 'none';
        });

        // 初始化 Tesseract AI 辨識引擎 (同時載入英文與繁體中文)
        async function initOCR() {
            try {
                statusBox.innerText = "載入中英文字型模型中 (初次需下載較大檔案，請稍候)...";
                worker = await Tesseract.createWorker(['eng', 'chi_tra']);

                statusBox.className = "status-box pending";
                statusBox.innerText = "引擎就緒，請開始中英文檢測";
                startCamera();
            } catch (err) {
                statusBox.innerText = "辨識引擎載入失敗";
                console.error(err);
            }
        }

        // 啟動手機相機
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: { exact: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        focusMode: "continuous"
                    }
                }).catch(() => {
                    return navigator.mediaDevices.getUserMedia({ video: true });
                });

                video.srcObject = stream;
                video.play();
                
                videoTrack = stream.getVideoTracks()[0];
                await applyFastFocusSettings(videoTrack);

                videoContainer.addEventListener('click', () => triggerFastManualFocus());

                // 每 2.5 秒執行一次辨識
                setInterval(processFrame, 2500);
            } catch (err) {
                alert("無法開啟相機，請檢查瀏覽器權限或確認是否使用 HTTPS！");
                statusBox.innerText = "相機開啟失敗";
            }
        }

        // 核心：影像預處理與裁切辨識
        async function processFrame() {
            if (!worker || isProcessing || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            
            isProcessing = true;

            try {
                const vWidth = video.videoWidth;   
                const vHeight = video.videoHeight; 

                const uiBoxHeightPx = 50; 
                const containerHeight = videoContainer.clientHeight;

                const boxW = vWidth * 0.8; // 左右各內縮 10%
                const boxH = uiBoxHeightPx * (vHeight / containerHeight);
                const boxX = (vWidth - boxW) / 2;
                const boxY = (vHeight - boxH) / 2;

                canvas.width = boxW;   
                canvas.height = boxH;
                const ctx = canvas.getContext('2d');

                // 1. 繪製裁切畫面
                ctx.drawImage(video, boxX, boxY, boxW, boxH, 0, 0, boxW, boxH);

                // 2. 影像前處理：轉為灰階並增強對比
                let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    let avg = (data[i] * 0.3 + data[i + 1] * 0.59 + data[i + 2] * 0.11); // 轉灰階
                    let contrasted = avg < 120 ? 0 : 255; 
                    data[i]     = contrasted; // R
                    data[i + 1] = contrasted; // G
                    data[i + 2] = contrasted; // B
                }
                ctx.putImageData(imgData, 0, 0);

                // 3. 執行辨識
                const { data: { text } } = await worker.recognize(canvas);
                const cleanText = text.replace(/[\s\r\n]+/g, '').trim();
                
                if (cleanText) {
                    detectedTextEl.innerText = "識別文字：" + cleanText;
                } else {
                    detectedTextEl.innerText = "識別文字：(尋找中...)";
                }

                const expected = expectedInput.value.replace(/[\s\r\n]+/g, '').trim();
                
                // 不分大小寫比對：將辨識結果與預期文字皆轉為大寫
                const actualUpper = cleanText.toUpperCase();
                const expectedUpper = expected.toUpperCase();

                // 比對結果判定 PASS / FAIL
                if (expectedUpper && actualUpper.includes(expectedUpper)) {
                    statusBox.className = "status-box pass";
                    statusBox.innerText = "【 PASS 】文字相符";
                } else {
                    statusBox.className = "status-box fail";
                    statusBox.innerText = "【 FAIL 】文字不符";
                }
            } catch (error) {
                console.error(error);
            } finally {
                isProcessing = false;
            }
        }

        // 相機自動對焦設定
        async function applyFastFocusSettings(track) {
            try {
                const capabilities = track.getCapabilities();
                if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
                    await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                }
            } catch (err) {
                console.log("不支援進階對焦", err);
            }
        }

        // 點擊畫面單次極速對焦
        async function triggerFastManualFocus() {
            if (!videoTrack) return;
            try {
                const capabilities = videoTrack.getCapabilities();
                if (capabilities.focusMode && capabilities.focusMode.includes('single-shot')) {
                    await videoTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
                    setTimeout(async () => {
                        await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                    }, 1000);
                }
            } catch (err) {
                console.log("手動對焦受限", err);
            }
        }

        window.onload = initOCR;
    </script>
</body>
</html>
