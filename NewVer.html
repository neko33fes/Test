<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>文字比對系統 - 工業防卡死版</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 6px;
            background: #121212;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            box-sizing: border-box;
            overflow: hidden;
        }
        .wrapper {
            width: 100%;
            max-width: 400px;
            height: 100%;
            margin: 0 auto;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 6px;
        }
        h2 {
            margin: 0;
            font-size: 16px;
            flex-shrink: 0;
        }
        .input-group {
            width: 100%;
            flex-shrink: 0;
        }
        .controls-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            flex-shrink: 0;
        }
        select, input[type="text"] {
            padding: 9px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            border-radius: 8px;
            border: 2px solid #444;
            background: #222;
            color: #fff;
            text-align: center;
            outline: none;
        }
        select {
            text-align-last: center;
            color: #00e676;
            font-weight: bold;
        }
        input[type="text"]::placeholder {
            color: #777;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 50%;
            max-height: 100%;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #444;
            background: #000;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: height 0.2s ease;
            flex-shrink: 0;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform-origin: center center;
            transition: transform 0.2s ease;
        }
        canvas {
            display: none;
        }
        .scan-box {
            position: absolute;
            width: var(--box-size, 50%);
            height: var(--box-size, 50%);
            border: 2px solid rgba(255, 235, 59, 0.8);
            box-sizing: border-box;
            pointer-events: none;
            border-radius: 6px;
            transition: width 0.2s ease, height 0.2s ease;
        }
        .status-box {
            padding: 8px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .pending {
            background: #ef6c00;
            color: #fff;
        }
        .pass {
            background: #2e7d32;
            color: #fff;
        }
        .fail {
            background: #c62828;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <h2>文字比對系統</h2>
        
        <div class="input-group">
            <input type="text" id="expectedText" placeholder="請輸入欲檢核的特定文字" value="">
        </div>

        <div class="controls-grid">
            <select id="intervalSelect" onchange="changeInterval(this)">
                <option value="" disabled>⏱️ 頻率：選擇中</option>
                <option value="1">頻率: 1.0 秒</option>
                <option value="2">頻率: 2.0 秒</option>
                <option value="2.5" selected>頻率: 2.5 秒</option>
                <option value="3">頻率: 3.0 秒</option>
                <option value="5">頻率: 5.0 秒</option>
            </select>

            <select id="heightSelect" onchange="changeVideoHeight(this)">
                <option value="" disabled>📱 高度：選擇中</option>
                <option value="100%">高度: 100%</option>
                <option value="75%">高度: 75%</option>
                <option value="50%" selected>高度: 50%</option>
                <option value="25%">高度: 25%</option>
                <option value="10%">高度: 10%</option>
            </select>

            <select id="boxSelect" onchange="changeScanBoxSize(this)">
                <option value="" disabled>🔲 框大小：選擇中</option>
                <option value="1.0">框大小: 100%</option>
                <option value="0.75">框大小: 75%</option>
                <option value="0.5" selected>框大小: 50%</option>
                <option value="0.25">框大小: 25%</option>
                <option value="0.1">框大小: 10%</option>
            </select>

            <select id="zoomSelect" onchange="changeZoom(this)">
                <option value="" disabled>🔍 放大：選擇中</option>
                <option value="1" selected>放大: 1x</option>
                <option value="2">放大: 2x</option>
                <option value="5">放大: 5x</option>
                <option value="10">放大: 10x</option>
            </select>
        </div>

        <div class="video-container" id="videoContainer" style="height: 50%;">
            <video id="video" autoplay playsinline muted></video>
            <div id="scanBox" class="scan-box" style="--box-size: 50%;"></div>
        </div>
        <canvas id="canvas"></canvas>
        <div id="statusBox" class="status-box pending">正在載入模型...</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusBox = document.getElementById('statusBox');
        const expectedInput = document.getElementById('expectedText');
        const videoContainer = document.getElementById('videoContainer');
        const scanBox = document.getElementById('scanBox');
        
        let videoTrack = null, worker = null, isProcessing = false, scanTimer = null;
        let currentInterval = 2.5;
        let currentBoxScale = 0.5; 
        let currentZoom = 1;       

        let failCount = 0; 
        const requiredFailCount = 2; 

        const rotCanvas = document.createElement('canvas');
        const rotCtx = rotCanvas.getContext('2d');

        function changeVideoHeight(selectObj) {
            const heightPercent = selectObj.value;
            videoContainer.style.height = heightPercent;
            if (heightPercent === '100%') {
                videoContainer.style.flex = '1';
                videoContainer.style.minHeight = '0';
            } else {
                videoContainer.style.flex = 'none';
            }
        }

        function changeScanBoxSize(selectObj) {
            currentBoxScale = parseFloat(selectObj.value);
            scanBox.style.setProperty('--box-size', (currentBoxScale * 100) + '%');
        }

        function changeInterval(selectObj) {
            currentInterval = parseFloat(selectObj.value);
            failCount = 0;
            restartScanLoop();
        }

        async function changeZoom(selectObj) {
            const zoomLevel = parseFloat(selectObj.value);
            currentZoom = zoomLevel;

            if (videoTrack) {
                try {
                    const caps = videoTrack.getCapabilities();
                    if (caps.zoom) {
                        const targetZoom = Math.min(Math.max(zoomLevel, caps.zoom.min), caps.zoom.max);
                        await videoTrack.applyConstraints({ advanced: [{ zoom: targetZoom }] });
                        video.style.transform = 'scale(1)';
                        return;
                    }
                } catch (e) {}
            }
            video.style.transform = `scale(${zoomLevel})`;
        }

        async function initOCR() {
            try {
                statusBox.innerText = "載入中英文字型模型中...";
                worker = await Tesseract.createWorker(['eng', 'chi_tra']);
                statusBox.className = "status-box pending";
                statusBox.innerText = "引擎就緒，請輸入確認文字";
                startCamera();
                restartScanLoop();
            } catch (err) {
                statusBox.innerText = "引擎載入失敗";
                console.error(err);
            }
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
                }).catch(() => navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }));
                video.srcObject = stream;
                video.play();
                videoTrack = stream.getVideoTracks()[0];
                try {
                    const caps = videoTrack.getCapabilities();
                    if (caps.focusMode && caps.focusMode.includes('continuous')) {
                        await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                    }
                } catch (e) {}
            } catch (err) {
                statusBox.innerText = "相機開啟失敗";
            }
        }

        function restartScanLoop() {
            if (scanTimer) {
                clearTimeout(scanTimer);
                scanTimer = null;
            }
            const runLoop = async () => {
                await processFrame();
                // 確保迴圈持續不斷觸發
                scanTimer = setTimeout(runLoop, currentInterval * 1000);
            };
            scanTimer = setTimeout(runLoop, currentInterval * 1000);
        }

        async function processFrame() {
            if (!worker || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            
            // 如果上一張卡住超過 8 秒，強制解鎖防死結
            if (isProcessing) {
                console.warn("偵測到辨識忙碌中，跳過此幀...");
                return;
            }

            const expected = expectedInput.value.replace(/[\s\r\n]+/g, '').trim().toUpperCase();
            if (!expected) {
                statusBox.className = "status-box pending";
                statusBox.innerText = "請於上方輸入確認文字";
                failCount = 0;
                return;
            }

            isProcessing = true;
            
            // 安全保險：設定 8 秒強制逾時解鎖，防止意外卡死
            const safetyTimeout = setTimeout(() => {
                if (isProcessing) {
                    console.error("辨識超時，強制重置鎖定狀態");
                    isProcessing = false;
                }
            }, 8000);

            try {
                const vW = video.videoWidth, vH = video.videoHeight;
                const boxW = vW * currentBoxScale, boxH = vH * currentBoxScale;
                const boxX = (vW - boxW) / 2, boxY = (vH - boxH) / 2;
                canvas.width = boxW; canvas.height = boxH;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, boxX, boxY, boxW, boxH, 0, 0, boxW, boxH);
                
                const angles = [0, 90, 180, 270];
                let matched = false;

                for (let angle of angles) {
                    let targetCanvas = canvas;
                    if (angle !== 0) {
                        const isSwap = (angle === 90 || angle === 270);
                        rotCanvas.width = isSwap ? boxH : boxW;
                        rotCanvas.height = isSwap ? boxW : boxH;
                        rotCtx.clearRect(0, 0, rotCanvas.width, rotCanvas.height);
                        rotCtx.save();
                        rotCtx.translate(rotCanvas.width / 2, rotCanvas.height / 2);
                        rotCtx.rotate((angle * Math.PI) / 180);
                        rotCtx.drawImage(canvas, -boxW / 2, -boxH / 2);
                        rotCtx.restore();
                        targetCanvas = rotCanvas;
                    }
                    const { data: { text } } = await worker.recognize(targetCanvas);
                    const cleanText = text.replace(/[\s\r\n]+/g, '').trim().toUpperCase();
                    
                    if (cleanText.includes(expected)) {
                        matched = true;
                        break; 
                    }
                }

                if (matched) {
                    failCount = 0;
                    statusBox.className = "status-box pass";
                    statusBox.innerText = "【 PASS 】文字相符";
                } else {
                    failCount++;
                    if (failCount >= requiredFailCount) {
                        statusBox.className = "status-box fail";
                        statusBox.innerText = "【 FAIL 】文字不符";
                    } else {
                        statusBox.className = "status-box pending";
                        statusBox.innerText = "【 檢核中... 】再次確認中";
                    }
                }
            } catch (error) {
                console.error("辨識過程發生錯誤:", error);
            } finally {
                clearTimeout(safetyTimeout);
                isProcessing = false; // 確保一定會解鎖
            }
        }

        window.onload = initOCR;
    </script>
</body>
</html>
