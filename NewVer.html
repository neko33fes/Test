<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中英文字檢測 App (自選鏡頭版)</title>
    <!-- 引入 Tesseract.js 文字辨識庫 -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #121212; 
            color: #fff; 
            text-align: center; 
            margin: 0; 
            padding: 10px; 
        }
        h2 { margin: 10px 0; font-size: 20px; }
        .input-group { margin: 8px 0; }
        input[type="text"], select { 
            padding: 10px; 
            font-size: 16px; 
            width: 80%; 
            max-width: 300px; 
            border-radius: 6px; 
            border: 1px solid #444; 
            background: #222; 
            color: #fff; 
            text-align: center; 
        }
        select {
            text-align-last: center;
        }

        /* 全景相機預覽框 */
        .video-container { 
            position: relative; 
            width: 100%; 
            max-width: 400px; 
            height: 240px; 
            margin: 10px auto; 
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #444;
            background: #000;
            cursor: pointer;
        }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
        }
        canvas { display: none; }
        
        /* 中央基準紅線 */
        .scan-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            transform: translateY(-50%);
            pointer-events: none;
            z-index: 10;
            background: repeating-linear-gradient(
                to right,
                #ff1744,
                #ff1744 12px,
                transparent 12px,
                transparent 24px
            );
        }

        /* 狀態看板樣式 */
        .status-box { 
            margin: 15px auto; 
            padding: 16px; 
            max-width: 400px; 
            font-size: 22px; 
            font-weight: bold; 
            border-radius: 10px; 
            transition: 0.3s; 
        }
        .pending { background: #ef6c00; color: #fff; }
        .pass { background: #2e7d32; color: #fff; }
        .fail { background: #c62828; color: #fff; }
        p { font-size: 13px; color: #aaa; margin: 6px 0; }
    </style>
</head>
<body>

    <h2>中英文字檢測系統</h2>
    
    <div class="input-group">
        <label>比對文字：</label><br>
        <input type="text" id="expectedText" value="NE5532P">
    </div>

    <!-- 鏡頭自選手動下拉選單 -->
    <div class="input-group">
        <label>選擇相機鏡頭：</label><br>
        <select id="cameraSelect" onchange="switchCamera()">
            <option value="">載入可用鏡頭中...</option>
        </select>
    </div>

    <!-- 全景相機與紅線 -->
    <div class="video-container" id="videoContainer">
        <video id="video" autoplay playsinline muted></video>
        <div class="scan-line"></div>
    </div>
    <canvas id="canvas"></canvas>

    <!-- 狀態顯示 -->
    <div id="statusBox" class="status-box pending">正在載入中英文字型模型...</div>
    <p id="detectedText">識別文字：無</p>
    <p>（請將目標文字對準中央紅線，點擊畫面可手動觸發對焦）</p>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusBox = document.getElementById('statusBox');
        const expectedInput = document.getElementById('expectedText');
        const videoContainer = document.getElementById('videoContainer');
        const detectedTextEl = document.getElementById('detectedText');
        const cameraSelect = document.getElementById('cameraSelect');

        let videoTrack = null;
        let worker = null;
        let isProcessing = false;
        let currentStream = null;

        // 初始化 Tesseract AI 辨識引擎
        async function initOCR() {
            try {
                statusBox.innerText = "載入中英文字型模型中 (初次需下載較大檔案，請稍候)...";
                worker = await Tesseract.createWorker(['eng', 'chi_tra']);

                await worker.setParameters({
                    tessedit_pageseg_mode: '7', 
                });

                statusBox.className = "status-box pending";
                statusBox.innerText = "引擎就緒，正在取得相機清單...";
                
                // 先取得相機權限，才能完整列出手機上的所有鏡頭
                await getCameraList();
            } catch (err) {
                statusBox.innerText = "辨識引擎載入失敗";
                console.error(err);
            }
        }

        // 取得手機上所有可用的相機鏡頭並填入下拉選單
        async function getCameraList() {
            try {
                // 先請求一次相機權限以解鎖裝置名稱
                const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
                tempStream.getTracks().forEach(track => track.stop()); // 關閉暫時串流

                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');

                cameraSelect.innerHTML = "";
                
                if (videoDevices.length === 0) {
                    cameraSelect.innerHTML = '<option value="">找不到可用相機</option>';
                    return;
                }

                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    // 若無名稱則給預設編號
                    option.text = device.label || `相機鏡頭 ${index + 1}`;
                    cameraSelect.appendChild(option);
                });

                // 自動啟動選單中的第一個鏡頭（優先找後置鏡頭）
                let selectedId = videoDevices[0].deviceId;
                for (let d of videoDevices) {
                    if (d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('environment') || d.label.toLowerCase().includes('後')) {
                        selectedId = d.deviceId;
                        cameraSelect.value = selectedId;
                        break;
                    }
                }

                startCamera(selectedId);
            } catch (err) {
                console.error("無法列出相機裝置", err);
                // 若權限被擋或不支援，直接用預設後鏡頭啟動
                startCamera(null);
            }
        }

        // 啟動指定 DeviceId 的相機
        async function startCamera(deviceId) {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }

                const constraints = {
                    video: deviceId ? { deviceId: { exact: deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } } : { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                currentStream = stream;
                video.srcObject = stream;
                video.play();
                
                videoTrack = stream.getVideoTracks()[0];
                await applyCameraCapabilities(videoTrack);

                videoContainer.removeEventListener('click', triggerFastManualFocus);
                videoContainer.addEventListener('click', () => triggerFastManualFocus());

                // 啟動背景辨識定時器（確保不會重複建立 setInterval）
                if (!window.scanInterval) {
                    window.scanInterval = setInterval(processFrame, 2000);
                }
            } catch (err) {
                alert("無法開啟選定的相機，請檢查瀏覽器權限！");
                statusBox.innerText = "相機開啟失敗";
            }
        }

        // 當下拉選單切換時觸發
        function switchCamera() {
            const selectedId = cameraSelect.value;
            if (selectedId) {
                startCamera(selectedId);
            }
        }

        // 讀取相機對焦設定
        async function applyCameraCapabilities(track) {
            try {
                const capabilities = track.getCapabilities();
                if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
                    await track.applyConstraints({ 
                        advanced: [{ focusMode: 'continuous' }] 
                    });
                }
            } catch (err) {
                console.log("相機進階功能受限", err);
            }
        }

        // 核心：全景畫面顯示，背景自動擷取中央區域進行高速辨識
        async function processFrame() {
            if (!worker || isProcessing || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            
            isProcessing = true;

            try {
                const vWidth = video.videoWidth;   
                const vHeight = video.videoHeight; 

                const containerHeight = videoContainer.clientHeight;
                
                const heightPercentage = 0.35; 
                const uiBoxHeightPx = containerHeight * heightPercentage;

                const boxW = vWidth * 0.9; 
                const boxH = uiBoxHeightPx * (vHeight / containerHeight);
                const boxX = (vWidth - boxW) / 2;
                const boxY = (vHeight - boxH) / 2;

                canvas.width = boxW;   
                canvas.height = boxH;
                const ctx = canvas.getContext('2d');

                ctx.drawImage(video, boxX, boxY, boxW, boxH, 0, 0, boxW, boxH);

                let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    let avg = (data[i] * 0.3 + data[i + 1] * 0.59 + data[i + 2] * 0.11);
                    let contrasted = avg < 120 ? 0 : 255; 
                    data[i]     = contrasted; 
                    data[i + 1] = contrasted; 
                    data[i + 2] = contrasted; 
                }
                ctx.putImageData(imgData, 0, 0);

                const { data: { text } } = await worker.recognize(canvas);
                const cleanText = text.replace(/[\s\r\n]+/g, '').trim();
                
                if (cleanText) {
                    detectedTextEl.innerText = "識別文字：" + cleanText;
                } else {
                    detectedTextEl.innerText = "識別文字：(尋找中...)";
                }

                const expected = expectedInput.value.replace(/[\s\r\n]+/g, '').trim();
                const actualUpper = cleanText.toUpperCase();
                const expectedUpper = expected.toUpperCase();

                if (expectedUpper && actualUpper.includes(expectedUpper)) {
                    statusBox.className = "status-box pass";
                    statusBox.innerText = "【 PASS 】文字相符";
                } else {
                    statusBox.className = "status-box fail";
                    statusBox.innerText = "【 FAIL 】文字不符";
                }
            } catch (error) {
                console.error(error);
            } finally {
                isProcessing = false;
            }
        }

        // 點擊畫面單次極速對焦
        async function triggerFastManualFocus() {
            if (!videoTrack) return;
            try {
                const capabilities = videoTrack.getCapabilities();
                if (capabilities.focusMode && capabilities.focusMode.includes('single-shot')) {
                    await videoTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
                    setTimeout(async () => {
                        await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                    }, 1000);
                }
            } catch (err) {
                console.log("手動對焦受限", err);
            }
        }

        window.onload = initOCR;
    </script>
</body>
</html>
