<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>工業級行動即時文字比對系統</title>
    <!-- 引入 Tesseract.js OCR 辨識引擎 CDN -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        /* ================= 1. 全域與根元素樣式 ================= */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* ================= 2. 主版面容器 (Flex 垂直排版) ================= */
        .wrapper {
            width: 100%;
            height: 100%;
            margin: 0 auto;
            padding: 6px 5%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 6px;
            position: relative;
        }

        /* ================= 3. 頂部導覽列與標題 ================= */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            padding: 0 4px;
        }
        h2 {
            margin: 0;
            font-size: 16px;
            color: #ffffff;
        }

        /* ================= 4. 設定按鈕樣式 ================= */
        .config-btn {
            background: #1a1a1a;
            color: #39c5bb;
            border: 2px solid #333333;
            padding: 4px 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        /* ================= 5. 目標文字輸入群組 ================= */
        .input-group {
            width: 100%;
            flex-shrink: 0;
        }
        input[type="text"] {
            padding: 9px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            border-radius: 8px;
            border: 2px solid #ffffff;
            background: #000000;
            color: #ffffff;
            text-align: center;
            outline: none;
        }
        input[type="text"]::placeholder {
            color: #666666;
        }

        /* ================= 6. 彈出式設定面板 (Modal) ================= */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(3px);
            z-index: 99;
            display: none;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 16px;
        }
        .modal-content {
            background: #000000;
            border: 2px solid #39c5bb;
            border-radius: 12px;
            width: 100%;
            max-width: 340px;
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }
        .modal-content h3 {
            margin: 0 0 4px 0;
            font-size: 15px;
            text-align: center;
            color: #39c5bb;
        }
        .control-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .control-row label {
            font-size: 11px;
            color: #aaaaaa;
        }
        .modal-content select {
            padding: 8px;
            font-size: 13px;
            border-radius: 6px;
            border: 2px solid #333333;
            background: #000000;
            color: #ffffff;
            text-align: center;
            outline: none;
            font-weight: bold;
        }
        .close-modal-btn {
            margin-top: 6px;
            background: #39c5bb;
            color: #000000;
            border: none;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }

        /* ================= 7. 相機預覽區與檢測框 ================= */
        .video-container {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 0;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.25);
            background: #000000;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-wrapper-inner {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
            transition: transform 0.2s ease;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        canvas {
            display: none;
        }
        
        /* 畫面中央的 OCR 辨識框範圍 */
        .scan-box {
            position: absolute;
            width: var(--box-size, 50%);
            height: var(--box-size, 50%);
            border: 2px solid rgba(57, 197, 187, 0.25);
            box-sizing: border-box;
            pointer-events: none;
            border-radius: 8px;
            transition: width 0.1s ease, height 0.1s ease;
            z-index: 10;
        }

        /* ================= 8. 底部狀態提示列 (Pending / Pass / Fail) ================= */
        .status-box {
            padding: 10px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .pending { background: #ef6c00; color: #ffffff; } /* 檢核中 / 準備中狀態 */
        .pass { background: #2e7d32; color: #ffffff; }    /* 比對成功狀態 */
        .fail { background: #c62828; color: #ffffff; }    /* 比對失敗狀態 */
    </style>
</head>
<body>
    <!-- 主介面排版結構 -->
    <div class="wrapper">
        <!-- 頂部列：標題與設定按鈕 -->
        <div class="header-bar">
            <h2>文字比對系統</h2>
            <button class="config-btn" onclick="toggleModal(true)">⚙️ 設定</button>
        </div>
        
        <!-- 目標文字輸入欄位 -->
        <div class="input-group">
            <input type="text" id="expectedText" placeholder="請輸入欲檢核的特定文字" value="">
        </div>

        <!-- 彈出式設定面板 (Modal) -->
        <div id="configModal" class="modal-overlay">
            <div class="modal-content">
                <h3>系統參數設定</h3>
                
                <!-- 掃描頻率設定選單 -->
                <div class="control-row">
                    <label>⏱️ 掃描頻率</label>
                    <select id="intervalSelect" onchange="changeInterval(this)">
                        <option value="1">1.0 秒</option>
                        <option value="2">2.0 秒</option>
                        <option value="2.5" selected>2.5 秒 (預設)</option>
                        <option value="3">3.0 秒</option>
                        <option value="5">5.0 秒</option>
                    </select>
                </div>

                <!-- 檢測框大小基準設定選單 -->
                <div class="control-row">
                    <label>🔲 檢測框大小基準</label>
                    <select id="boxSelect" onchange="changeScanBoxSize(this)">
                        <option value="1.0">100% 框</option>
                        <option value="0.75">75% 框</option>
                        <option value="0.5" selected>50% 框 (預設)</option>
                        <option value="0.25">25% 框</option>
                        <option value="0.1">10% 框</option>
                    </select>
                </div>

                <!-- 畫面放大倍率設定選單 -->
                <div class="control-row">
                    <label>🔍 畫面放大倍率 (全縮放連動)</label>
                    <select id="zoomSelect" onchange="changeZoom(this)">
                        <option value="1" selected>1x (正常)</option>
                        <option value="2">2x 放大</option>
                        <option value="5">5x 放大</option>
                        <option value="10">10x 放大</option>
                    </select>
                </div>

                <!-- 關閉設定面板按鈕 -->
                <button class="close-modal-btn" onclick="toggleModal(false)">確定 / 關閉</button>
            </div>
        </div>

        <!-- 相機串流預覽區與 OCR 辨識框 -->
        <div class="video-container" id="videoContainer">
            <div class="video-wrapper-inner" id="videoWrapper">
                <video id="video" autoplay playsinline muted></video>
            </div>
            <div id="scanBox" class="scan-box" style="--box-size: 50%;"></div>
        </div>

        <!-- 隱藏式 Canvas 用於截圖處理 -->
        <canvas id="canvas"></canvas>

        <!-- 底部狀態顯示框 -->
        <div id="statusBox" class="status-box pending">正在載入模型...</div>
    </div>

    <script>
        /* ================= DOM 元素參考對應 ================= */
        const video = document.getElementById('video');
        const videoWrapper = document.getElementById('videoWrapper');
        const canvas = document.getElementById('canvas');
        const statusBox = document.getElementById('statusBox');
        const expectedInput = document.getElementById('expectedText');
        const scanBox = document.getElementById('scanBox');
        const configModal = document.getElementById('configModal');
        
        /* ================= 系統狀態與設定變數 ================= */
        let videoTrack = null;        // 相機視訊軌道物件
        let worker = null;            // Tesseract OCR 引擎執行緒
        let isProcessing = false;     // 辨識處理中鎖定旗標 (防止重複呼叫)
        let scanTimer = null;         // 定時掃描計時器
        let currentInterval = 2.5;    // 目前掃描頻率 (秒)
        let baseBoxScale = 0.5;       // 檢測框大小基準比例
        let currentZoom = 1;          // 目前畫面縮放倍率

        let failCount = 0;            // 連續失敗計數器
        const requiredFailCount = 2;  // 判定 FAIL 所需的連續失敗次數

        /* 建立旋轉處理專用的暫存 Canvas 與 2D Context */
        const rotCanvas = document.createElement('canvas');
        const rotCtx = rotCanvas.getContext('2d');

        /**
         * 切換設定面板的顯示與隱藏狀態
         * @param {boolean} show - true 為顯示面板，false 則隱藏
         */
        function toggleModal(show) {
            configModal.style.display = show ? 'flex' : 'none';
        }

        /**
         * 變更檢測框大小基準並即時更新畫面顯示
         * @param {HTMLSelectElement} selectObj - 框大小下拉選單物件
         */
        function changeScanBoxSize(selectObj) {
            baseBoxScale = parseFloat(selectObj.value);
            updateScanBoxDisplay();
        }

        /**
         * 變更掃描頻率，重置失敗計數並重啟掃描迴圈
         * @param {HTMLSelectElement} selectObj - 頻率下拉選單物件
         */
        function changeInterval(selectObj) {
            currentInterval = parseFloat(selectObj.value);
            failCount = 0;
            restartScanLoop();
        }

        /**
         * 變更畫面放大倍率，套用 CSS 縮放並連動調整檢測框
         * @param {HTMLSelectElement} selectObj - 縮放下拉選單物件
         */
        function changeZoom(selectObj) {
            const zoomLevel = parseFloat(selectObj.value);
            currentZoom = zoomLevel;
            videoWrapper.style.transform = `scale(${zoomLevel})`;
            updateScanBoxDisplay();
        }

        /**
         * 計算有效縮放比例並更新檢測框的 CSS 變數
         */
        function updateScanBoxDisplay() {
            const effectiveScale = baseBoxScale / currentZoom;
            scanBox.style.setProperty('--box-size', (effectiveScale * 100) + '%');
        }

        /**
         * 初始化 Tesseract OCR 引擎並載入中英文字型模型
         */
        async function initOCR() {
            try {
                statusBox.innerText = "載入中英文字型模型中...";
                worker = await Tesseract.createWorker(['eng', 'chi_tra']);
                statusBox.className = "status-box pending";
                statusBox.innerText = "引擎就緒，請輸入確認文字";
                startCamera();
                restartScanLoop();
            } catch (err) {
                statusBox.innerText = "引擎載入失敗";
                console.error(err);
            }
        }

        /**
         * 啟動行動裝置後鏡頭串流，並嘗試套用持續自動對焦
         */
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
                }).catch(() => navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }));
                video.srcObject = stream;
                video.play();
                videoTrack = stream.getVideoTracks()[0];
                try {
                    const caps = videoTrack.getCapabilities();
                    if (caps.focusMode && caps.focusMode.includes('continuous')) {
                        await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                    }
                } catch (e) {}
            } catch (err) {
                statusBox.innerText = "相機開啟失敗";
            }
        }

        /**
         * 清除舊的計時器並重新啟動定時截圖掃描迴圈
         */
        function restartScanLoop() {
            if (scanTimer) {
                clearTimeout(scanTimer);
                scanTimer = null;
            }
            const runLoop = async () => {
                await processFrame();
                scanTimer = setTimeout(runLoop, currentInterval * 1000);
            };
            scanTimer = setTimeout(runLoop, currentInterval * 1000);
        }

        /**
         * 核心處理函數：擷取畫面、進行四向旋轉 OCR 辨識與文字比對
         */
        async function processFrame() {
            // 檢查引擎是否就緒以及影片資料是否充足
            if (!worker || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            if (isProcessing) return;

            // 取得並清理使用者輸入的目標比對文字
            const expected = expectedInput.value.replace(/[\s\r\n]+/g, '').trim().toUpperCase();
            if (!expected) {
                statusBox.className = "status-box pending";
                statusBox.innerText = "請於上方輸入確認文字";
                failCount = 0;
                return;
            }

            isProcessing = true;
            // 安全機制：若辨識逾時（8秒）則強制解除鎖定
            const safetyTimeout = setTimeout(() => {
                if (isProcessing) isProcessing = false;
            }, 8000);

            try {
                const vW = video.videoWidth, vH = video.videoHeight;
                const effectiveScale = baseBoxScale / currentZoom;
                const boxW = vW * effectiveScale;
                const boxH = vH * effectiveScale;
                const boxX = (vW - boxW) / 2;
                const boxY = (vH - boxH) / 2;

                // 將檢測框內的畫面截取至 Canvas 畫布
                canvas.width = boxW; 
                canvas.height = boxH;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, boxX, boxY, boxW, boxH, 0, 0, boxW, boxH);
                
                // 定義四個旋轉角度 (0°, 90°, 180°, 270°) 支援多方向辨識
                const angles = [0, 90, 180, 270];
                let matched = false;

                for (let angle of angles) {
                    let targetCanvas = canvas;
                    if (angle !== 0) {
                        const isSwap = (angle === 90 || angle === 270);
                        rotCanvas.width = isSwap ? boxH : boxW;
                        rotCanvas.height = isSwap ? boxW : boxH;
                        rotCtx.clearRect(0, 0, rotCanvas.width, rotCanvas.height);
                        rotCtx.save();
                        rotCtx.translate(rotCanvas.width / 2, rotCanvas.height / 2);
                        rotCtx.rotate((angle * Math.PI) / 180);
                        rotCtx.drawImage(canvas, -boxW / 2, -boxH / 2);
                        rotCtx.restore();
                        targetCanvas = rotCanvas;
                    }
                    
                    // 執行 OCR 辨識並清理辨識結果文字
                    const { data: { text } } = await worker.recognize(targetCanvas);
                    const cleanText = text.replace(/[\s\r\n]+/g, '').trim().toUpperCase();
                    
                    // 比對是否包含目標字串
                    if (cleanText.includes(expected)) {
                        matched = true;
                        break; 
                    }
                }

                // 根據比對結果更新介面狀態 (PASS / FAIL / 檢核中)
                if (matched) {
                    failCount = 0;
                    statusBox.className = "status-box pass";
                    statusBox.innerText = "【 PASS 】文字相符";
                } else {
                    failCount++;
                    if (failCount >= requiredFailCount) {
                        statusBox.className = "status-box fail";
                        statusBox.innerText = "【 FAIL 】文字不符";
                    } else {
                        statusBox.className = "status-box pending";
                        statusBox.innerText = "【 檢核中... 】再次確認中";
                    }
                }
            } catch (error) {
                console.error(error);
            } finally {
                clearTimeout(safetyTimeout);
                isProcessing = false;
            }
        }

        // 當網頁載入完成時自動初始化 OCR 引擎與系統
        window.onload = initOCR;
    </script>
</body>
</html>
