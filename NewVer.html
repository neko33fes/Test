<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>文字比對系統</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 6px;
            background: #121212;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            box-sizing: border-box;
            overflow: hidden;
        }
        .wrapper {
            width: 100%;
            max-width: 400px;
            height: 100%;
            margin: 0 auto;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 4px;
        }
        h2 {
            margin: 0;
            font-size: 16px;
            flex-shrink: 0;
        }
        .input-group {
            width: 100%;
            flex-shrink: 0;
        }
        .btn-group {
            width: 100%;
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .ctrl-btn {
            flex: 1;
            padding: 4px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            border: 2px solid #444;
            background: #222;
            color: #aaa;
            cursor: pointer;
            text-align: center;
        }
        .ctrl-btn.active {
            background: #00e676;
            color: #000;
            border-color: #00e676;
        }
        input[type="text"] {
            padding: 8px;
            font-size: 15px;
            width: 100%;
            box-sizing: border-box;
            border-radius: 8px;
            border: 2px solid #444;
            background: #222;
            color: #fff;
            text-align: center;
        }
        input[type="text"]::placeholder {
            color: #777;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-height: 100%;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #444;
            background: #000;
            cursor: pointer;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: height 0.2s ease;
            flex-shrink: 1;
            min-height: 0;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        canvas {
            display: none;
        }
        .crosshair {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .crosshair::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 1px;
            background: repeating-linear-gradient(to right, #00e676, #00e676 8px, transparent 8px, transparent 18px);
        }
        .crosshair::after {
            content: '';
            position: absolute;
            width: 1px;
            height: 100%;
            background: repeating-linear-gradient(to bottom, #00e676, #00e676 8px, transparent 8px, transparent 18px);
        }
        .status-box {
            padding: 8px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .pending {
            background: #ef6c00;
            color: #fff;
        }
        .pass {
            background: #2e7d32;
            color: #fff;
        }
        .fail {
            background: #c62828;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <h2>文字比對系統</h2>
        <div class="input-group">
            <input type="text" id="expectedText" placeholder="請輸入確認文字" value="">
        </div>
        <div class="btn-group">
            <button class="ctrl-btn" onclick="setIntervalTime(1, this)">1s</button>
            <button class="ctrl-btn" onclick="setIntervalTime(2, this)">2s</button>
            <button class="ctrl-btn active" onclick="setIntervalTime(2.5, this)">2.5s</button>
            <button class="ctrl-btn" onclick="setIntervalTime(3, this)">3s</button>
            <button class="ctrl-btn" onclick="setIntervalTime(5, this)">5s</button>
        </div>
        <div class="btn-group">
            <button class="ctrl-btn active" onclick="setVideoHeight('100%', this)">100%</button>
            <button class="ctrl-btn" onclick="setVideoHeight('75%', this)">75%</button>
            <button class="ctrl-btn" onclick="setVideoHeight('50%', this)">50%</button>
            <button class="ctrl-btn" onclick="setVideoHeight('25%', this)">25%</button>
            <button class="ctrl-btn" onclick="setVideoHeight('10%', this)">10%</button>
        </div>
        <div class="video-container" id="videoContainer" style="height: 100%;">
            <video id="video" autoplay playsinline muted></video>
            <div class="crosshair"></div>
        </div>
        <canvas id="canvas"></canvas>
        <div id="statusBox" class="status-box pending">正在載入模型...</div>
    </div>
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusBox = document.getElementById('statusBox');
        const expectedInput = document.getElementById('expectedText');
        const videoContainer = document.getElementById('videoContainer');
        
        let videoTrack = null, worker = null, isProcessing = false, scanTimer = null;
        let currentInterval = 2.5;

        function setVideoHeight(heightPercent, btn) {
            btn.parentElement.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            videoContainer.style.height = heightPercent;
            if (heightPercent === '100%') {
                videoContainer.style.flex = '1';
                videoContainer.style.minHeight = '0';
            } else {
                videoContainer.style.flex = 'none';
            }
        }

        function setIntervalTime(secs, btn) {
            btn.parentElement.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentInterval = secs;
            restartScanLoop();
        }

        async function initOCR() {
            try {
                statusBox.innerText = "載入中英文字型模型中...";
                worker = await Tesseract.createWorker(['eng', 'chi_tra']);
                statusBox.className = "status-box pending";
                statusBox.innerText = "引擎就緒，請輸入確認文字";
                startCamera();
                restartScanLoop();
            } catch (err) {
                statusBox.innerText = "引擎載入失敗";
                console.error(err);
            }
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
                }).catch(() => navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }));
                video.srcObject = stream;
                video.play();
                videoTrack = stream.getVideoTracks()[0];
                try {
                    const caps = videoTrack.getCapabilities();
                    if (caps.focusMode && caps.focusMode.includes('continuous')) {
                        await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                    }
                } catch (e) {}
                videoContainer.addEventListener('click', triggerManualFocus);
            } catch (err) {
                statusBox.innerText = "相機開啟失敗";
            }
        }

        function restartScanLoop() {
            if (scanTimer) clearTimeout(scanTimer);
            const runLoop = async () => {
                await processFrame();
                scanTimer = setTimeout(runLoop, currentInterval * 1000);
            };
            scanTimer = setTimeout(runLoop, currentInterval * 1000);
        }

        async function processFrame() {
            if (!worker || isProcessing || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            const expected = expectedInput.value.replace(/[\s\r\n]+/g, '').trim().toUpperCase();
            if (!expected) {
                statusBox.className = "status-box pending";
                statusBox.innerText = "請於上方輸入確認文字";
                return;
            }
            isProcessing = true;
            try {
                const vW = video.videoWidth, vH = video.videoHeight;
                const boxW = vW * 0.75, boxH = vH * 0.75;
                const boxX = (vW - boxW) / 2, boxY = (vH - boxH) / 2;
                canvas.width = boxW; canvas.height = boxH;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, boxX, boxY, boxW, boxH, 0, 0, boxW, boxH);
                let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    let avg = (data[i] * 0.3 + data[i + 1] * 0.59 + data[i + 2] * 0.11);
                    let val = avg < 120 ? 0 : 255;
                    data[i] = data[i+1] = data[i+2] = val;
                }
                ctx.putImageData(imgData, 0, 0);
                const angles = [0, 90, 180, 270];
                let matched = false;
                for (let angle of angles) {
                    let targetCanvas = canvas;
                    if (angle !== 0) {
                        const rotCanvas = document.createElement('canvas');
                        const isSwap = (angle === 90 || angle === 270);
                        rotCanvas.width = isSwap ? boxH : boxW;
                        rotCanvas.height = isSwap ? boxW : boxH;
                        const rotCtx = rotCanvas.getContext('2d');
                        rotCtx.translate(rotCanvas.width / 2, rotCanvas.height / 2);
                        rotCtx.rotate((angle * Math.PI) / 180);
                        rotCtx.drawImage(canvas, -boxW / 2, -boxH / 2);
                        targetCanvas = rotCanvas;
                    }
                    const { data: { text } } = await worker.recognize(targetCanvas);
                    const cleanText = text.replace(/[\s\r\n]+/g, '').trim().toUpperCase();
                    if (cleanText.includes(expected)) {
                        matched = true;
                        break;
                    }
                }
                if (matched) {
                    statusBox.className = "status-box pass";
                    statusBox.innerText = "【 PASS 】文字相符";
                } else {
                    statusBox.className = "status-box fail";
                    statusBox.innerText = "【 FAIL 】文字不符";
                }
            } catch (error) {
                console.error(error);
            } finally {
                isProcessing = false;
            }
        }

        async function triggerManualFocus() {
            if (!videoTrack) return;
            try {
                const caps = videoTrack.getCapabilities();
                if (caps.focusMode && caps.focusMode.includes('single-shot')) {
                    await videoTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
                    setTimeout(async () => {
                        await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                    }, 1000);
                }
            } catch (e) {}
        }

        window.onload = initOCR;
    </script>
</body>
</html>
