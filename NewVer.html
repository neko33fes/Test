<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IC 局部檢測 App (快速對焦版)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1c1c1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* 綠色對焦辨識框 */
        .focus-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            height: 40%;
            border: 3px solid #30d158;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(48, 209, 88, 0.4);
            pointer-events: none;
        }
        button {
            background-color: #34c759;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:active {
            background-color: #248a3d;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #eaeaea;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>IC 表面文字即時檢測</h2>
    <p>預期型號：NE5532P</p>

    <div class="video-wrapper">
        <video id="webcam" autoplay playsinline></video>
        <div class="focus-box"></div>
    </div>

    <button id="start-btn">啟動檢測 App</button>
    <div class="status" id="status-text">狀態：等待點擊啟動...</div>
</div>

<script>
    const video = document.getElementById('webcam');
    const startBtn = document.getElementById('start-btn');
    const statusText = document.getElementById('status-text');

    startBtn.addEventListener('click', async () => {
        statusText.innerText = "狀態：正在請求相機並優化對焦...";
        
        try {
            // 1. 基本設定：指定使用後置鏡頭 (environment)
            const constraints = {
                video: {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };

            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;

            // 2. 核心：等串流載入後，強制將鏡頭推向「快速/持續自動對焦」
            video.onloadedmetadata = async () => {
                const track = stream.getVideoTracks()[0];
                const capabilities = track.getCapabilities ? track.getCapabilities() : {};
                
                statusText.innerText = "狀態：相機已啟動，調整對焦模式...";

                // 檢查瀏覽器是否支援進階對焦模式設定 (主要支援於 Android Chrome)
                if (capabilities.focusMode) {
                    const focusConstraints = {};
                    
                    // 優先選用持續自動對焦 (continuous)，其次是自動對焦 (auto)
                    if (capabilities.focusMode.includes('continuous')) {
                        focusConstraints.focusMode = 'continuous';
                    } else if (capabilities.focusMode.includes('auto')) {
                        focusConstraints.focusMode = 'auto';
                    }

                    // 如果支援微距/近距離對焦 (例如近看 IC 晶片文字)，強制寫入
                    if (capabilities.focusDistance) {
                        statusText.innerText = "狀態：已啟用近距離高速辨識模式";
                    }

                    // 將對焦約束條件應用到鏡頭上
                    if (Object.keys(focusConstraints).length > 0) {
                        await track.applyConstraints({ advanced: [focusConstraints] });
                        statusText.innerText = "狀態：即時檢測中 (已開啟持續快速對焦)";
                    } else {
                        statusText.innerText = "狀態：即時檢測中 (使用硬體預設對焦)";
                    }
                } else {
                    statusText.innerText = "狀態：即時檢測中 (此瀏覽器不支援進階對焦設定)";
                }
            };

        } catch (error) {
            console.error("無法開啟相機:", error);
            statusText.innerText = "錯誤：無法存取相機，請檢查權限設定。";
        }
    });
</script>

</body>
</html>
