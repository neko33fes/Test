<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>文字比對系統 - 彈出選單版</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 6px;
            background: #121212;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            box-sizing: border-box;
            overflow: hidden;
        }
        .wrapper {
            width: 100%;
            max-width: 400px;
            height: 100%;
            margin: 0 auto;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 6px;
            position: relative;
        }
        /* 頂部標題列（含設定按鈕） */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            padding: 0 4px;
        }
        h2 {
            margin: 0;
            font-size: 16px;
        }
        .config-btn {
            background: #333;
            color: #00e676;
            border: 2px solid #555;
            padding: 4px 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .input-group {
            width: 100%;
            flex-shrink: 0;
        }
        input[type="text"] {
            padding: 9px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            border-radius: 8px;
            border: 2px solid #444;
            background: #222;
            color: #fff;
            text-align: center;
            outline: none;
        }
        input[type="text"]::placeholder {
            color: #777;
        }

        /* 彈出式設定面板遮罩與內容 */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(3px);
            z-index: 99;
            display: none; /* 預設隱藏 */
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 16px;
        }
        .modal-content {
            background: #1e1e1e;
            border: 2px solid #00e676;
            border-radius: 12px;
            width: 100%;
            max-width: 340px;
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }
        .modal-content h3 {
            margin: 0 0 4px 0;
            font-size: 15px;
            text-align: center;
            color: #00e676;
        }
        .control-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .control-row label {
            font-size: 11px;
            color: #aaa;
        }
        .modal-content select {
            padding: 8px;
            font-size: 13px;
            border-radius: 6px;
            border: 2px solid #444;
            background: #2b2b2b;
            color: #fff;
            text-align: center;
            outline: none;
            font-weight: bold;
        }
        .close-modal-btn {
            margin-top: 6px;
            background: #00e676;
            color: #000;
            border: none;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }

        /* 相機預覽區 */
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            flex: 1;
            min-height: 0;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #444;
            background: #000;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: height 0.2s ease;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform-origin: center center;
            transition: transform 0.2s ease;
        }
        canvas {
            display: none;
        }
        .scan-box {
            position: absolute;
            width: var(--box-size, 50%);
            height: var(--box-size, 50%);
            border: 2px solid rgba(255, 235, 59, 0.8);
            box-sizing: border-box;
            pointer-events: none;
            border-radius: 6px;
            transition: width 0.2s ease, height 0.2s ease;
        }
        .status-box {
            padding: 10px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .pending { background: #ef6c00; color: #fff; }
        .pass { background: #2e7d32; color: #fff; }
        .fail { background: #c62828; color: #fff; }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- 頂部標題與設定按鈕 -->
        <div class="header-bar">
            <h2>文字比對系統</h2>
            <button class="config-btn" onclick="toggleModal(true)">⚙️ 設定</button>
        </div>
        
        <div class="input-group">
            <input type="text" id="expectedText" placeholder="請輸入欲檢核的特定文字" value="">
        </div>

        <!-- 彈出式設定面板 -->
        <div id="configModal" class="modal-overlay">
            <div class="modal-content">
                <h3>系統參數設定</h3>
                
                <div class="control-row">
                    <label>⏱️ 掃描頻率</label>
                    <select id="intervalSelect" onchange="changeInterval(this)">
                        <option value="1">1.0 秒</option>
                        <option value="2">2.0 秒</option>
                        <option value="2.5" selected>2.5 秒 (預設)</option>
                        <option value="3">3.0 秒</option>
                        <option value="5">5.0 秒</option>
                    </select>
                </div>

                <div class="control-row">
                    <label>📱 預覽畫面高度</label>
                    <select id="heightSelect" onchange="changeVideoHeight(this)">
                        <option value="100%">100% 畫面</option>
                        <option value="75%">75% 畫面</option>
                        <option value="50%" selected>50% 畫面 (預設)</option>
                        <option value="25%">25% 畫面</option>
                        <option value="10%">10% 畫面</option>
                    </select>
                </div>

                <div class="control-row">
                    <label>🔲 檢測框大小</label>
                    <select id="boxSelect" onchange="changeScanBoxSize(this)">
                        <option value="1.0">100% 框</option>
                        <option value="0.75">75% 框</option>
                        <option value="0.5" selected>50% 框 (預設)</option>
                        <option value="0.25">25% 框</option>
                        <option value="0.1">10% 框</option>
                    </select>
                </div>

                <div class="control-row">
                    <label>🔍 鏡頭放大倍率</label>
                    <select id="zoomSelect" onchange="changeZoom(this)">
                        <option value="1" selected>1x (正常)</option>
                        <option value="2">2x 放大</option>
                        <option value="5">5x 放大</option>
                        <option value="10">10x 放大</option>
                    </select>
                </div>

                <button class="close-modal-btn" onclick="toggleModal(false)">確定 / 關閉</button>
            </div>
        </div>

        <!-- 相機預覽區 (預設撐滿剩餘空間) -->
        <div class="video-container" id="videoContainer">
            <video id="video" autoplay playsinline muted></video>
            <div id="scanBox" class="scan-box" style="--box-size: 50%;"></div>
        </div>
        <canvas id="canvas"></canvas>
        <div id="statusBox" class="status-box pending">正在載入模型...</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusBox = document.getElementById('statusBox');
        const expectedInput = document.getElementById('expectedText');
        const videoContainer = document.getElementById('videoContainer');
        const scanBox = document.getElementById('scanBox');
        const configModal = document.getElementById('configModal');
        
        let videoTrack = null, worker = null, isProcessing = false, scanTimer = null;
        let currentInterval = 2.5;
        let currentBoxScale = 0.5; 
        let currentZoom = 1;       

        let failCount = 0; 
        const requiredFailCount = 2; 

        const rotCanvas = document.createElement('canvas');
        const rotCtx = rotCanvas.getContext('2d');

        function toggleModal(show) {
            configModal.style.display = show ? 'flex' : 'none';
        }

        function changeVideoHeight(selectObj) {
            const heightPercent = selectObj.value;
            videoContainer.style.height = heightPercent;
            if (heightPercent === '100%') {
                videoContainer.style.flex = '1';
                videoContainer.style.minHeight = '0';
            } else {
                videoContainer.style.flex = 'none';
            }
        }

        function changeScanBoxSize(selectObj) {
            currentBoxScale = parseFloat(selectObj.value);
            scanBox.style.setProperty('--box-size', (currentBoxScale * 100) + '%');
        }

        function changeInterval(selectObj) {
            currentInterval = parseFloat(selectObj.value);
            failCount = 0;
            restartScanLoop();
        }

        async function changeZoom(selectObj) {
            const zoomLevel = parseFloat(selectObj.value);
            currentZoom = zoomLevel;

            if (videoTrack) {
                try {
                    const caps = videoTrack.getCapabilities();
                    if (caps.zoom) {
                        const targetZoom = Math.min(Math.max(zoomLevel, caps.zoom.min), caps.zoom.max);
                        await videoTrack.applyConstraints({ advanced: [{ zoom: targetZoom }] });
                        video.style.transform = 'scale(1)';
                        return;
                    }
                } catch (e) {}
            }
            video.style.transform = `scale(${zoomLevel})`;
        }

        async function initOCR() {
            try {
                statusBox.innerText = "載入中英文字型模型中...";
                worker = await Tesseract.createWorker(['eng', 'chi_tra']);
                statusBox.className = "status-box pending";
                statusBox.innerText = "引擎就緒，請輸入確認文字";
                startCamera();
                restartScanLoop();
            } catch (err) {
                statusBox.innerText = "引擎載入失敗";
                console.error(err);
            }
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
                }).catch(() => navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }));
                video.srcObject = stream;
                video.play();
                videoTrack = stream.getVideoTracks()[0];
                try {
                    const caps = videoTrack.getCapabilities();
                    if (caps.focusMode && caps.focusMode.includes('continuous')) {
                        await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                    }
                } catch (e) {}
            } catch (err) {
                statusBox.innerText = "相機開啟失敗";
            }
        }

        function restartScanLoop() {
            if (scanTimer) {
                clearTimeout(scanTimer);
                scanTimer = null;
            }
            const runLoop = async () => {
                await processFrame();
                scanTimer = setTimeout(runLoop, currentInterval * 1000);
            };
            scanTimer = setTimeout(runLoop, currentInterval * 1000);
        }

        async function processFrame() {
            if (!worker || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            
            if (isProcessing) return;

            const expected = expectedInput.value.replace(/[\s\r\n]+/g, '').trim().toUpperCase();
            if (!expected) {
                statusBox.className = "status-box pending";
                statusBox.innerText = "請於上方輸入確認文字";
                failCount = 0;
                return;
            }

            isProcessing = true;
            
            const safetyTimeout = setTimeout(() => {
                if (isProcessing) isProcessing = false;
            }, 8000);

            try {
                const vW = video.videoWidth, vH = video.videoHeight;
                const boxW = vW * currentBoxScale, boxH = vH * currentBoxScale;
                const boxX = (vW - boxW) / 2, boxY = (vH - boxH) / 2;
                canvas.width = boxW; canvas.height = boxH;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, boxX, boxY, boxW, boxH, 0, 0, boxW, boxH);
                
                const angles = [0, 90, 180, 270];
                let matched = false;

                for (let angle of angles) {
                    let targetCanvas = canvas;
                    if (angle !== 0) {
                        const isSwap = (angle === 90 || angle === 270);
                        rotCanvas.width = isSwap ? boxH : boxW;
                        rotCanvas.height = isSwap ? boxW : boxH;
                        rotCtx.clearRect(0, 0, rotCanvas.width, rotCanvas.height);
                        rotCtx.save();
                        rotCtx.translate(rotCanvas.width / 2, rotCanvas.height / 2);
                        rotCtx.rotate((angle * Math.PI) / 180);
                        rotCtx.drawImage(canvas, -boxW / 2, -boxH / 2);
                        rotCtx.restore();
                        targetCanvas = rotCanvas;
                    }
                    const { data: { text } } = await worker.recognize(targetCanvas);
                    const cleanText = text.replace(/[\s\r\n]+/g, '').trim().toUpperCase();
                    
                    if (cleanText.includes(expected)) {
                        matched = true;
                        break; 
                    }
                }

                if (matched) {
                    failCount = 0;
                    statusBox.className = "status-box pass";
                    statusBox.innerText = "【 PASS 】文字相符";
                } else {
                    failCount++;
                    if (failCount >= requiredFailCount) {
                        statusBox.className = "status-box fail";
                        statusBox.innerText = "【 FAIL 】文字不符";
                    } else {
                        statusBox.className = "status-box pending";
                        statusBox.innerText = "【 檢核中... 】再次確認中";
                    }
                }
            } catch (error) {
                console.error(error);
            } finally {
                clearTimeout(safetyTimeout);
                isProcessing = false;
            }
        }

        window.onload = initOCR;
    </script>
</body>
</html>
