<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>工業級行動即時文字比對系統</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        :root {
            --border-color: #000000FF;
            --global-font-size: 2.0vh;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: var(--bg-color, #404040FF);
            color: #FFFFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            box-sizing: border-box;
            overflow: hidden;
            font-size: var(--global-font-size);
        }
        .wrapper {
            width: 97.5vw;
            height: 97.5vh;
            max-width: 97.5vw;
            max-height: 97.5vh;
            margin: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 0.4rem 2%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 0.4rem;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            flex-shrink: 0;
            padding: 0 0.4rem;
            box-sizing: border-box;
        }
        h2 {
            margin: 0;
            font-size: 1rem;
            color: var(--title-color, #FFFFFFFF);
        }
        .btn-group {
            display: flex;
            gap: 0.5rem;
        }
        .config-btn {
            background: var(--btn-bg, #1A1A1AFF);
            color: var(--btn-text, #39C5BBFF);
            border: 2px solid var(--border-color, #000000FF);
            padding: 0.4em 0.8em;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 0.4rem;
            cursor: pointer;
            line-height: 1.2;
        }
        .input-group {
            width: 100%;
            flex-shrink: 0;
        }
        input[type="text"].target-input {
            padding: 0.4em 0.8em;
            height: auto;
            font-size: 1rem;
            line-height: 1.2;
            width: 100%;
            box-sizing: border-box;
            border-radius: 0.5rem;
            border: 2px solid var(--border-color, #000000FF);
            background: var(--input-bg, var(--bg-color, #404040FF));
            color: var(--input-text, #FFFFFFFF);
            text-align: center;
            outline: none;
        }
        input[type="text"].target-input::placeholder {
            color: #AAAAAAFF;
        }
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(3px);
            z-index: 99;
            display: none;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 12px;
        }
        .modal-content {
            background: var(--bg-color, #404040FF);
            border: 2px solid #39C5BBFF;
            border-radius: 0.8rem;
            width: 100%;
            max-width: min(96vw, 480px);
            max-height: 88vh;
            padding: 1rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            text-align: left;
            overflow-y: auto;
            font-size: 1rem;
        }
        .modal-content h3 {
            margin: 0 0 0.2rem 0;
            font-size: 1.1rem;
            text-align: center;
            color: #39C5BBFF;
        }
        .control-row {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            width: 100%;
            box-sizing: border-box;
        }
        .control-row label {
            font-size: 0.9rem;
            color: #DDDDDDFF;
            line-height: 1.3;
        }
        .control-row-group {
            display: flex;
            gap: 0.6rem;
            width: 100%;
            box-sizing: border-box;
        }
        .control-row-group .control-row {
            flex: 1;
            min-width: 0;
        }
        /* 保留三欄並排：微調間距與字型，確保三欄內的 8 碼色碼能完整呈現且不擠壓 */
        .control-row-group.triple {
            gap: 4px;
        }
        .control-row-group.triple .control-row {
            min-width: 0;
            flex: 1;
        }
        .control-row-group.triple .control-row label {
            font-size: 0.7rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }
        .control-row-group.triple .control-row input[type="text"] {
            padding: 0.35em 0.2rem;
            font-size: 0.85rem;
            letter-spacing: -0.5px;
        }
        .modal-content select {
            padding: 0.4em 0.6em;
            height: auto;
            font-size: 1rem;
            line-height: 1.2;
            border-radius: 0.4rem;
            border: 2px solid #333333FF;
            background: var(--bg-color, #404040FF);
            color: #FFFFFFFF;
            text-align: center;
            outline: none;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
        }
        .control-row input[type="text"] {
            padding: 0.4em 0.6em;
            height: auto;
            font-size: 1rem;
            line-height: 1.2;
            border-radius: 0.4rem;
            border: 2px solid #333333FF;
            background: #000000FF;
            color: #FFFFFFFF;
            text-align: center;
            outline: none;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
        }
        .close-modal-btn {
            margin-top: 0.4rem;
            background: #39C5BBFF;
            color: #000000FF;
            border: none;
            padding: 0.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 0.4rem;
            cursor: pointer;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            line-height: 1.2;
        }
        .video-container {
            position: relative;
            width: calc(100% * var(--container-scale, 0.5));
            height: calc(var(--max-video-h, 70vh) * var(--container-scale, 0.5));
            flex-grow: 0;
            flex-shrink: 0;
            border-radius: 0.6rem;
            overflow: hidden;
            border: 2px solid var(--border-color, #000000FF);
            background: var(--bg-color, #404040FF);
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: width 0.2s ease, height 0.2s ease;
        }
        .video-wrapper-inner {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
            transition: transform 0.2s ease;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        canvas {
            display: none;
        }
        .scan-box {
            position: absolute;
            width: var(--box-size, 50%);
            height: var(--box-size, 50%);
            border: 2px solid var(--scanbox-color, #39C5BB80);
            box-sizing: border-box;
            pointer-events: none;
            border-radius: 0.5rem;
            transition: width 0.1s ease, height 0.1s ease;
            z-index: 10;
        }
        .status-box {
            padding: 0.4rem;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 0.5rem;
            box-sizing: border-box;
            flex-shrink: 0;
            line-height: 1.2;
        }
        .pending { background: var(--pending-bg, #EF6C00FF); color: var(--pending-text, #FFFFFFFF); }
        .pass { background: var(--pass-bg, #2E7D32FF); color: var(--pass-text, #FFFFFFFF); }
        .fail { background: var(--fail-bg, #C62828FF); color: var(--fail-text, #FFFFFFFF); }
    </style>
</head>
<body style="background: #404040FF;">
    <div class="wrapper" id="mainWrapper">
        <div class="header-bar" id="headerBar">
            <h2>文字比對系統</h2>
            <div class="btn-group">
                <button class="config-btn" onclick="toggleModal('settingsModal', true)">設定</button>
                <button class="config-btn" onclick="toggleModal('colorModal', true)">顏色</button>
            </div>
        </div>
        <div class="input-group" id="inputGroup">
            <input type="text" id="expectedText" class="target-input" placeholder="請輸入欲檢核的特定文字" value="">
        </div>

        <!-- 設定面板 -->
        <div id="settingsModal" class="modal-overlay">
            <div class="modal-content">
                <h3>系統參數設定</h3>
                <div class="control-row">
                    <label>全域字體大小</label>
                    <select id="fontSizeSelect" onchange="changeFontSize(this)">
                        <option value="1.5vh">1</option>
                        <option value="2.0vh" selected>2</option>
                        <option value="2.3vh">3</option>
                        <option value="2.6vh">4</option>
                        <option value="3.0vh">5</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>相機預覽區大小</label>
                    <select id="containerScaleSelect" onchange="changeContainerScale(this)">
                        <option value="1.0">100%</option>
                        <option value="0.75">75%</option>
                        <option value="0.5" selected>50% (預設)</option>
                        <option value="0.25">25%</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>掃描頻率</label>
                    <select id="intervalSelect" onchange="changeInterval(this)">
                        <option value="1">1.0 秒</option>
                        <option value="2">2.0 秒</option>
                        <option value="2.5" selected>2.5 秒 (預設)</option>
                        <option value="3">3.0 秒</option>
                        <option value="5">5.0 秒</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>檢測框大小基準</label>
                    <select id="boxSelect" onchange="changeScanBoxSize(this)">
                        <option value="1.0">100% 框</option>
                        <option value="0.75">75% 框</option>
                        <option value="0.5" selected>50% 框 (預設)</option>
                        <option value="0.25">25% 框</option>
                        <option value="0.1">10% 框</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>畫面放大倍率</label>
                    <select id="zoomSelect" onchange="changeZoom(this)">
                        <option value="1" selected>1x (正常)</option>
                        <option value="2">2x 放大</option>
                        <option value="5">5x 放大</option>
                        <option value="10">10x 放大</option>
                    </select>
                </div>
                <button class="close-modal-btn" onclick="toggleModal('settingsModal', false)">確定 / 關閉</button>
            </div>
        </div>

        <!-- 顏色面板 -->
        <div id="colorModal" class="modal-overlay">
            <div class="modal-content">
                <h3>顏色設定</h3>
                <div class="control-row-group">
                    <div class="control-row">
                        <label>啟動前背景色</label>
                        <input type="text" id="bgBeforeInput" value="#404040FF" oninput="updateBgBefore(this)">
                    </div>
                    <div class="control-row">
                        <label>啟動後背景色</label>
                        <input type="text" id="bgAfterInput" value="#0F0F0FFF" oninput="updateBgAfter(this)">
                    </div>
                </div>
                <div class="control-row-group">
                    <div class="control-row">
                        <label>啟動前外框色</label>
                        <input type="text" id="borderBeforeInput" value="#000000FF" oninput="updateBorderBefore(this)">
                    </div>
                    <div class="control-row">
                        <label>啟動後外框色</label>
                        <input type="text" id="borderAfterInput" value="#404040FF" oninput="updateBorderAfter(this)">
                    </div>
                </div>
                <!-- 保留三欄並排，並透過最佳化 padding 與字元間距，讓 8 碼 Hex 在格子內完美顯示 -->
                <div class="control-row-group triple">
                    <div class="control-row">
                        <label>PASS 狀態</label>
                        <input type="text" id="passBgInput" value="#2E7D32FF" oninput="updateColorVar('--pass-bg', this)">
                    </div>
                    <div class="control-row">
                        <label>FAIL 狀態</label>
                        <input type="text" id="failBgInput" value="#C62828FF" oninput="updateColorVar('--fail-bg', this)">
                    </div>
                    <div class="control-row">
                        <label>檢核中狀態</label>
                        <input type="text" id="pendingBgInput" value="#EF6C00FF" oninput="updateColorVar('--pending-bg', this)">
                    </div>
                </div>
                <div class="control-row">
                    <label>系統標題文字顏色 (#Hex)</label>
                    <input type="text" id="titleColorInput" value="#FFFFFFFF" oninput="updateColorVar('--title-color', this)">
                </div>
                <div class="control-row">
                    <label>按鈕背景色 (#Hex)</label>
                    <input type="text" id="btnBgInput" value="#1A1A1AFF" oninput="updateColorVar('--btn-text', this)">
                </div>
                <div class="control-row">
                    <label>按鈕文字顏色 (#Hex)</label>
                    <input type="text" id="btnTextInput" value="#39C5BBFF" oninput="updateColorVar('--btn-text', this)">
                </div>
                <div class="control-row">
                    <label>目標輸入框文字顏色 (#Hex)</label>
                    <input type="text" id="inputTextInput" value="#FFFFFFFF" oninput="updateColorVar('--input-text', this)">
                </div>
                <div class="control-row">
                    <label>中央檢測框顏色 (#Hex)</label>
                    <input type="text" id="scanBoxColorInput" value="#39C5BB80" oninput="updateScanBoxColor(this)">
                </div>
                <div class="control-row">
                    <label>狀態列文字顏色 (#Hex)</label>
                    <input type="text" id="statusTextInput" value="#FFFFFFFF" oninput="updateColorVar('--pending-text', this); updateColorVar('--pass-text', this); updateColorVar('--fail-text', this);">
                </div>
                <button class="close-modal-btn" onclick="toggleModal('colorModal', false)">確定 / 關閉</button>
            </div>
        </div>

        <div class="video-container" id="videoContainer" style="--container-scale: 0.5;">
            <div class="video-wrapper-inner" id="videoWrapper">
                <video id="video" autoplay playsinline muted></video>
            </div>
            <div id="scanBox" class="scan-box" style="--box-size: 50%;"></div>
        </div>
        <canvas id="canvas"></canvas>
        <div id="statusBox" class="status-box pending">正在載入模型...</div>
    </div>
    <script>
        const mainWrapper = document.getElementById('mainWrapper');
        const headerBar = document.getElementById('headerBar');
        const inputGroup = document.getElementById('inputGroup');
        const video = document.getElementById('video');
        const videoContainer = document.getElementById('videoContainer');
        const videoWrapper = document.getElementById('videoWrapper');
        const canvas = document.getElementById('canvas');
        const statusBox = document.getElementById('statusBox');
        const expectedInput = document.getElementById('expectedText');
        const scanBox = document.getElementById('scanBox');
        const bgBeforeInput = document.getElementById('bgBeforeInput');
        const bgAfterInput = document.getElementById('bgAfterInput');
        const borderBeforeInput = document.getElementById('borderBeforeInput');
        const borderAfterInput = document.getElementById('borderAfterInput');
        
        let customBgBefore = "#404040FF";
        let customBgAfter = "#0F0F0FFF";
        let customBorderBefore = "#000000FF";
        let customBorderAfter = "#404040FF";
        let cameraStarted = false;

        let videoTrack = null;
        let worker = null;
        let isProcessing = false;
        let scanTimer = null;
        let currentInterval = 2.5;
        let baseBoxScale = 0.5;
        let currentZoom = 1;
        let failCount = 0;
        const requiredFailCount = 2;
        const rotCanvas = document.createElement('canvas');
        const rotCtx = rotCanvas.getContext('2d');

        function updateMaxVideoHeight() {
            const wrapperH = mainWrapper.clientHeight;
            const headerH = headerBar.offsetHeight;
            const inputH = inputGroup.offsetHeight;
            const statusH = statusBox.offsetHeight;
            const availableH = wrapperH - headerH - inputH - statusH - 16;
            if (availableH > 50) {
                videoContainer.style.setProperty('--max-video-h', availableH + 'px');
            }
        }

        window.addEventListener('resize', updateMaxVideoHeight);

        function toggleModal(modalId, show) {
            document.getElementById(modalId).style.display = show ? 'flex' : 'none';
        }
        function changeFontSize(selectObj) {
            document.documentElement.style.setProperty('--global-font-size', selectObj.value);
            setTimeout(updateMaxVideoHeight, 50);
        }
        function changeContainerScale(selectObj) {
            const scaleVal = parseFloat(selectObj.value);
            updateMaxVideoHeight();
            videoContainer.style.setProperty('--container-scale', scaleVal);
        }
        function updateBgBefore(inputObj) {
            let val = inputObj.value.trim();
            if (/^#[0-9A-Fa-f]{8}$/.test(val) || /^#[0-9A-Fa-f]{6}$/.test(val)) {
                customBgBefore = val;
                if (!cameraStarted) applyBg(customBgBefore);
            }
        }
        function updateBgAfter(inputObj) {
            let val = inputObj.value.trim();
            if (/^#[0-9A-Fa-f]{8}$/.test(val) || /^#[0-9A-Fa-f]{6}$/.test(val)) {
                customBgAfter = val;
                if (cameraStarted) applyBg(customBgAfter);
            }
        }
        function updateBorderBefore(inputObj) {
            let val = inputObj.value.trim();
            if (/^#[0-9A-Fa-f]{8}$/.test(val) || /^#[0-9A-Fa-f]{6}$/.test(val)) {
                customBorderBefore = val;
                if (!cameraStarted) document.documentElement.style.setProperty('--border-color', customBorderBefore);
            }
        }
        function updateBorderAfter(inputObj) {
            let val = inputObj.value.trim();
            if (/^#[0-9A-Fa-f]{8}$/.test(val) || /^#[0-9A-Fa-f]{6}$/.test(val)) {
                customBorderAfter = val;
                if (cameraStarted) document.documentElement.style.setProperty('--border-color', customBorderAfter);
            }
        }
        function applyBg(color) {
            document.documentElement.style.setProperty('--bg-color', color);
            document.body.style.background = color;
        }
        function updateColorVar(variableName, inputObj, isBodyBackground = false) {
            let val = inputObj.value.trim();
            if (/^#[0-9A-Fa-f]{8}$/.test(val) || /^#[0-9A-Fa-f]{6}$/.test(val)) {
                document.documentElement.style.setProperty(variableName, val);
                if (isBodyBackground) applyBg(val);
            }
        }
        function updateScanBoxColor(inputObj) {
            let val = inputObj.value.trim();
            if (/^#[0-9A-Fa-f]{8}$/.test(val) || /^#[0-9A-Fa-f]{6}$/.test(val)) {
                scanBox.style.setProperty('--scanbox-color', val);
            }
        }
        function changeScanBoxSize(selectObj) {
            baseBoxScale = parseFloat(selectObj.value);
            updateScanBoxDisplay();
        }
        function changeInterval(selectObj) {
            currentInterval = parseFloat(selectObj.value);
            failCount = 0;
            restartScanLoop();
        }
        function changeZoom(selectObj) {
            const zoomLevel = parseFloat(selectObj.value);
            currentZoom = zoomLevel;
            videoWrapper.style.transform = `scale(${zoomLevel})`;
        }
        function updateScanBoxDisplay() {
            scanBox.style.setProperty('--box-size', (baseBoxScale * 100) + '%');
        }
        async function initOCR() {
            updateMaxVideoHeight();
            try {
                applyBg(customBgBefore);
                document.documentElement.style.setProperty('--border-color', customBorderBefore);
                borderBeforeInput.value = customBorderBefore;

                statusBox.innerText = "載入中英文字型模型中...";
                worker = await Tesseract.createWorker(['eng', 'chi_tra']);
                statusBox.className = "status-box pending";
                statusBox.innerText = "引擎就緒，請輸入確認文字";
                updateMaxVideoHeight();
                await startCamera();
                restartScanLoop();
            } catch (err) {
                statusBox.innerText = "引擎載入失敗";
                console.error(err);
            }
        }
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
                }).catch(() => navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }));
                video.srcObject = stream;
                video.play();
                videoTrack = stream.getVideoTracks()[0];
                
                cameraStarted = true;
                applyBg(customBgAfter);
                bgAfterInput.value = customBgAfter;

                document.documentElement.style.setProperty('--border-color', customBorderAfter);
                borderAfterInput.value = customBorderAfter;

                try {
                    const caps = videoTrack.getCapabilities();
                    if (caps.focusMode && caps.focusMode.includes('continuous')) {
                        await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                    }
                } catch (e) {}
            } catch (err) {
                statusBox.innerText = "相機開啟失敗";
            }
        }
        function restartScanLoop() {
            if (scanTimer) {
                clearTimeout(scanTimer);
                scanTimer = null;
            }
            const runLoop = async () => {
                await processFrame();
                scanTimer = setTimeout(runLoop, currentInterval * 1000);
            };
            scanTimer = setTimeout(runLoop, currentInterval * 1000);
        }
        async function processFrame() {
            if (!worker || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            if (isProcessing) return;
            const expected = expectedInput.value.replace(/[\s\r\n]+/g, '').trim().toUpperCase();
            if (!expected) {
                statusBox.className = "status-box pending";
                statusBox.innerText = "【 請輸入檢核文字 】";
                failCount = 0;
                return;
            }
            isProcessing = true;
            const safetyTimeout = setTimeout(() => {
                if (isProcessing) isProcessing = false;
            }, 8000);
            try {
                const vW = video.videoWidth, vH = video.videoHeight;
                const cW = videoContainer.clientWidth, cH = videoContainer.clientHeight;
                if (!vW || !vH || !cW || !cH) return;

                const coverScale = Math.max(cW / vW, cH / vH);
                const visibleW = (cW / coverScale) / currentZoom;
                const visibleH = (cH / coverScale) / currentZoom;

                const boxW = visibleW * baseBoxScale;
                const boxH = visibleH * baseBoxScale;
                const boxX = (vW - boxW) / 2;
                const boxY = (vH - boxH) / 2;

                canvas.width = boxW; 
                canvas.height = boxH;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, boxX, boxY, boxW, boxH, 0, 0, boxW, boxH);

                const angles = [0, 90, 180, 270];
                let matched = false;
                for (let angle of angles) {
                    let targetCanvas = canvas;
                    if (angle !== 0) {
                        const isSwap = (angle === 90 || angle === 270);
                        rotCanvas.width = isSwap ? boxH : boxW;
                        rotCanvas.height = isSwap ? boxW : boxH;
                        rotCtx.clearRect(0, 0, rotCanvas.width, rotCanvas.height);
                        rotCtx.save();
                        rotCtx.translate(rotCanvas.width / 2, rotCanvas.height / 2);
                        rotCtx.rotate((angle * Math.PI) / 180);
                        rotCtx.drawImage(canvas, -boxW / 2, -boxH / 2);
                        rotCtx.restore();
                        targetCanvas = rotCanvas;
                    }
                    const { data: { text } } = await worker.recognize(targetCanvas);
                    const cleanText = text.replace(/[\s\r\n]+/g, '').trim().toUpperCase();
                    if (cleanText.includes(expected)) {
                        matched = true;
                        break; 
                    }
                }
                if (matched) {
                    failCount = 0;
                    statusBox.className = "status-box pass";
                    statusBox.innerText = "【 PASS 】文字相符";
                } else {
                    failCount++;
                    if (failCount >= requiredFailCount) {
                        statusBox.className = "status-box fail";
                        statusBox.innerText = "【 FAIL 】文字不符";
                    } else {
                        statusBox.className = "status-box pending";
                        statusBox.innerText = "【 檢核中... 】再次確認中";
                    }
                }
            } catch (error) {
                console.error(error);
            } finally {
                clearTimeout(safetyTimeout);
                isProcessing = false;
            }
        }
        window.onload = initOCR;
    </script>
</body>
</html>
