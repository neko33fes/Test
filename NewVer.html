<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IC 高速局部檢測 App</title>
    <!-- 使用穩定安全的 CDN 載入 Tesseract.js -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { 
            font-family: sans-serif; background: #111; color: #fff; text-align: center; margin: 0; padding: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; box-sizing: border-box;
        }
        .app-container { width: 100%; max-width: 360px; margin: 0 auto; }
        h2 { font-size: 20px; margin: 10px 0; color: #00e676; }
        
        .video-container { position: relative; width: 100%; aspect-ratio: 4/3; margin: 10px auto; overflow: hidden; border-radius: 12px; border: 2px solid #444; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        /* 縮小對焦框：30% 高度、70% 寬度，符合真實小 IC 晶片的外觀形狀 */
        .scan-overlay {
            position: absolute; top: 35%; left: 15%; width: 70%; height: 30%;
            border: 2px solid #00e676; border-radius: 6px; box-sizing: border-box;
            pointer-events: none; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65);
            display: flex; align-items: center; justify-content: center;
        }
        .scan-overlay::before {
            content: "請將文字放入框內"; font-size: 11px; color: #00e676; background: rgba(0,0,0,0.7); padding: 2px 6px; border-radius: 4px; position: absolute; bottom: -25px;
        }
        
        canvas { display: none; }
        .status-box { margin: 10px 0; padding: 12px; font-size: 20px; font-weight: bold; border-radius: 8px; transition: 0.3s; }
        .pending { background: #f57c00; }
        .scanning { background: #29b6f6; }
        .pass { background: #2e7d32; }
        .fail { background: #c62828; }
        
        .input-group { margin: 5px 0; text-align: left; width: 100%; background: #222; padding: 10px; border-radius: 8px; box-sizing: border-box; border: 1px solid #333; }
        label { font-size: 14px; color: #aaa; font-weight: bold; }
        input { padding: 8px; font-size: 16px; width: 100%; border-radius: 5px; border: none; box-sizing: border-box; margin-top: 5px; background: #333; color: #fff; text-align: center; border: 1px solid #555; }
        
        .info-text { font-size: 13px; color: #aaa; margin: 8px 0; line-height: 1.4; }
        #detectedText { font-size: 15px; color: #fff; font-weight: bold; background: #222; padding: 8px; border-radius: 6px; border-left: 4px solid #29b6f6; text-align: left; word-break: break-all; }
        
        .btn-action { display: none; margin-top: 10px; padding: 12px 24px; font-size: 16px; background: #00e676; color: #000; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>IC 表面文字即時檢測</h2>
        
        <div class="input-group">
            <label>預期型號：</label>
            <input type="text" id="expectedText" value="NE5532P">
        </div>

        <div class="video-container">
            <video id="video" autoplay playsinline muted></video>
            <div class="scan-overlay"></div>
        </div>
        
        <canvas id="canvas"></canvas>

        <div id="statusBox" class="status-box pending">等待點擊啟動...</div>
        <button id="actionBtn" class="btn-action" onclick="startApp()">啟動高速檢測</button>
        
        <p id="detectedText">即時識別：無</p>
        <p class="info-text">💡 提示：本版本已開啟硬體連續追蹤對焦模式。若畫面模糊，可稍微拿遠再慢慢靠近。</p>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusBox = document.getElementById('statusBox');
        const detectedTextEl = document.getElementById('detectedText');
        const expectedInput = document.getElementById('expectedText');
        const actionBtn = document.getElementById('actionBtn');

        let worker = null;
        let isProcessing = false;
        let scanInterval = null;

        function showStartButton() {
            statusBox.className = "status-box pending";
            statusBox.innerText = "環境就緒，請點擊啟動";
            actionBtn.style.display = "block";
        }

        async function startApp() {
            actionBtn.style.display = "none";
            
            if (typeof Tesseract === 'undefined') {
                statusBox.className = "status-box fail";
                statusBox.innerText = "❌ 核心庫載入失敗，請重新整理";
                actionBtn.style.display = "block";
                return;
            }

            try {
                statusBox.innerText = "正在設定高速對焦相機...";
                await startCamera();
                
                statusBox.innerText = "正在載入辨識引擎...";
                if (!worker) {
                    worker = await Tesseract.createWorker('eng');
                }
                
                statusBox.className = "status-box scanning";
                statusBox.innerText = "請將 IC 文字移入框內";
                
                // 相機與引擎均就緒，啟動高頻率辨識循環 (調整為 800ms 一次，反應速度極快)
                if (scanInterval) clearInterval(scanInterval);
                scanInterval = setInterval(processFrame, 800); 
            } catch (err) {
                console.error(err);
                statusBox.className = "status-box fail";
                statusBox.innerText = "❌ 啟動失敗，請檢查權限";
                actionBtn.style.display = "block";
            }
        }

        async function startCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: { ideal: "environment" },
                    // 使用 Full HD 確保近距離剪裁字體時邊緣不失真
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            };

            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            await video.play();

            // 【關鍵硬體優化】強制要求手機硬體相機開啟「連續自動對焦」模式
            try {
                const track = stream.getVideoTracks()[0];
                const capabilities = track.getCapabilities();
                
                // 檢查該手機的後置鏡頭是否支援對焦模式設定
                if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
                    await track.applyConstraints({
                        advanced: [{ focusMode: 'continuous' }]
                    });
                    console.log("成功啟用硬體連續自動對焦。");
                }
            } catch (focusErr) {
                // 部分客製化 Android 瀏覽器或 iOS 舊版本不開放直接控制 FocusMode，此時會自動跳過不影響運作
                console.warn("瀏覽器不允許直接控制相機對焦模式，改用系統預設對焦:", focusErr);
            }
        }

        // 局部剪裁高速辨識
        async function processFrame() {
            if (!worker || isProcessing || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            isProcessing = true;

            try {
                const vWidth = video.videoWidth;
                const vHeight = video.videoHeight;

                const cropX = vWidth * 0.15;
                const cropY = vHeight * 0.35;
                const cropW = vWidth * 0.70;
                const cropH = vHeight * 0.30;

                canvas.width = cropW;
                canvas.height = cropH;
                const ctx = canvas.getContext('2d');
                
                // 工業特化極致二值化：提高 contrast 降噪，幫助失焦過渡期的模糊字體提早收斂成清晰黑白線條
                ctx.filter = 'grayscale(1) contrast(3.0) brightness(1.0)';
                ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
                ctx.filter = 'none'; 

                const { data: { text } } = await worker.recognize(canvas);
                
                const cleanText = text.replace(/[^a-zA-Z0-9\s]/g, '').replace(/\s+/g, ' ').trim().toUpperCase();
                const expected = expectedInput.value.trim().toUpperCase();
                
                if (!cleanText) {
                    detectedTextEl.innerText = "即時識別：未感測到文字";
                    return;
                }

                detectedTextEl.innerText = "即時識別：" + cleanText;

                if (expected && cleanText.includes(expected)) {
                    statusBox.className = "status-box pass";
                    statusBox.innerText = "【 PASS 】型號相符";
                } else {
                    statusBox.className = "status-box fail";
                    statusBox.innerText = "【 FAIL 】型號不符";
                }
                
            } catch (error) {
                console.error("高速處理幀出錯:", error);
            } finally {
                isProcessing = false;
            }
        }

        window.onload = showStartButton;
    </script>
</body>
</html>
