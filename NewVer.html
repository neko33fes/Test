<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IC 即時自動檢測 App (高精度二值化版)</title>
    <!-- 引入 Tesseract.js -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #121212; 
            color: #fff; 
            text-align: center; 
            margin: 0; 
            padding: 10px; 
        }
        h2 { margin: 10px 0; font-size: 22px; }
        .input-group { margin: 8px 0; }
        input { 
            padding: 10px; 
            font-size: 18px; 
            width: 80%; 
            max-width: 300px; 
            border-radius: 6px; 
            border: 1px solid #444; 
            background: #222; 
            color: #fff; 
            text-align: center; 
        }

        /* 相機預覽框 */
        .video-container { 
            position: relative; 
            width: 100%; 
            max-width: 400px; 
            height: 240px; 
            margin: 10px auto; 
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #444;
            background: #000;
            cursor: pointer;
        }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
        }
        
        /* 綠色取景對齊框 */
        .scan-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;   
            height: 55px; 
            border: 2px dashed #00e676;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .scan-box::after {
            content: "請將 IC 刻字置於綠框內 (點擊畫面可對焦)";
            position: absolute;
            bottom: -24px;
            left: 0;
            right: 0;
            font-size: 11px;
            color: #00e676;
            text-align: center;
            white-space: nowrap;
        }

        /* 偵錯預覽區：即時顯示目前送進 OCR 的黑白影像，方便檢查是否清晰 */
        .debug-container {
            margin: 10px auto;
            max-width: 300px;
            background: #222;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #444;
        }
        .debug-container p { margin: 0 0 4px 0; font-size: 12px; color: #888; }
        canvas { 
            max-width: 100%; 
            height: auto; 
            border-radius: 4px; 
            border: 1px solid #666;
            display: block;
            margin: 0 auto;
        }

        .status-box { 
            margin: 15px auto; 
            padding: 18px; 
            max-width: 400px; 
            font-size: 24px; 
            font-weight: bold; 
            border-radius: 10px; 
            transition: 0.3s; 
        }
        .pending { background: #ef6c00; color: #fff; }
        .pass { background: #2e7d32; color: #fff; }
        .fail { background: #c62828; color: #fff; }
        p { font-size: 14px; color: #aaa; margin: 6px 0; }
    </style>
</head>
<body>

    <h2>IC 表面文字即時檢測系統</h2>
    
    <div class="input-group">
        <label>預期型號：</label><br>
        <input type="text" id="expectedText" value="NE5532P">
    </div>

    <!-- 相機與對齊框 -->
    <div class="video-container" id="videoContainer">
        <video id="video" autoplay playsinline muted></video>
        <div class="scan-box"></div>
    </div>

    <!-- 影像前處理偵錯預覽 (讓您檢查文字是否清晰呈現) -->
    <div class="debug-container">
        <p>OCR 辨識即時影像預覽 (需黑底白字或白底黑字)</p>
        <canvas id="canvas"></canvas>
    </div>

    <!-- 狀態顯示 -->
    <div id="statusBox" class="status-box pending">載入辨識引擎中...</div>
    <p id="detectedText">即時識別文字：無</p>
    <p>（請確認上方預覽窗中的文字是否清晰可見，若模糊請點擊畫面重新對焦）</p>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusBox = document.getElementById('statusBox');
        const detectedTextEl = document.getElementById('detectedText');
        const expectedInput = document.getElementById('expectedText');
        const videoContainer = document.getElementById('videoContainer');

        let worker = null;
        let isProcessing = false;
        let consecutivePassCount = 0; 
        let videoTrack = null;

        // 初始化 Tesseract Worker
        async function initOCR() {
            try {
                worker = await Tesseract.createWorker('eng');
                await worker.setParameters({
                    // 放寬白名單，支援常見的英數字、連字號與斜線
                    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-/.',
                });
                statusBox.className = "status-box pending";
                statusBox.innerText = "引擎就緒，等待對準 IC";
                startCamera();
            } catch (err) {
                console.error(err);
                statusBox.innerText = "OCR 引擎載入失敗";
            }
        }

        // 啟動相機
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: { exact: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        focusMode: "continuous"
                    }
                }).catch(() => {
                    return navigator.mediaDevices.getUserMedia({ video: true });
                });

                video.srcObject = stream;
                video.play();
                
                videoTrack = stream.getVideoTracks()[0];
                await applyFastFocusSettings(videoTrack);

                videoContainer.addEventListener('click', () => triggerFastManualFocus());

                setInterval(processFrame, 1500); 
            } catch (err) {
                alert("無法開啟相機，請檢查瀏覽器權限或確認是否使用 HTTPS/Localhost！");
                statusBox.innerText = "相機開啟失敗";
            }
        }

        async function applyFastFocusSettings(track) {
            try {
                const capabilities = track.getCapabilities();
                let advancedSettings = {};

                if (capabilities.focusMode) {
                    if (capabilities.focusMode.includes('continuous')) {
                        advancedSettings.focusMode = 'continuous';
                    } else if (capabilities.focusMode.includes('macro')) {
                        advancedSettings.focusMode = 'macro';
                    }
                }

                if (Object.keys(advancedSettings).length > 0) {
                    await track.applyConstraints({ advanced: [advancedSettings] });
                }
            } catch (err) {
                console.log("硬體不支援進階對焦約束", err);
            }
        }

        async function triggerFastManualFocus() {
            if (!videoTrack) return;
            try {
                const capabilities = videoTrack.getCapabilities();
                if (capabilities.focusMode && capabilities.focusMode.includes('single-shot')) {
                    await videoTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
                    setTimeout(async () => {
                        await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                    }, 1000);
                }
            } catch (err) {
                console.log("手動極速對焦觸發受限", err);
            }
        }

        // 高精度影像前處理 (灰階 -> 強化對比 -> 雙向二值化閾值過濾)
        function captureAndPreprocess() {
            const ctx = canvas.getContext('2d');
            const vWidth = video.videoWidth;
            const vHeight = video.videoHeight;

            if (!vWidth || !vHeight) return false;

            const boxWidth = vWidth * 0.80;
            const boxHeight = 55; 
            const boxX = (vWidth - boxWidth) / 2;
            const boxY = (vHeight - boxHeight) / 2;

            canvas.width = boxWidth;
            canvas.height = boxHeight;

            ctx.drawImage(video, boxX, boxY, boxWidth, boxHeight, 0, 0, boxWidth, boxHeight);

            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imgData.data;
            
            // 計算平均亮度以自動適應環境光線
            let totalBrightness = 0;
            for (let i = 0; i < data.length; i += 4) {
                totalBrightness += (data[i] * 0.299 + data[i + 1] + data[i + 2] * 0.114);
            }
            let avgBrightness = totalBrightness / (data.length / 4);
            
            // 動態調整閾值，把背景雜訊濾掉，強化文字
            const threshold = avgBrightness * 0.85;

            for (let i = 0; i < data.length; i += 4) {
                let gray = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
                
                // 二值化：高於閾值的變白（背景），低於閾值的變黑（文字）
                let cVal = gray > threshold ? 255 : 0;

                data[i] = cVal;     
                data[i + 1] = cVal; 
                data[i + 2] = cVal; 
            }
            ctx.putImageData(imgData, 0, 0);
            return true;
        }

        async function processFrame() {
            if (!worker || isProcessing || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            
            isProcessing = true;

            try {
                if (!captureAndPreprocess()) {
                    isProcessing = false;
                    return;
                }

                const { data: { text } } = await worker.recognize(canvas);
                const cleanText = text.replace(/[^A-Z0-9-/.\\s]/g, '').replace(/\s+/g, ' ').trim(); 
                
                if (cleanText.length > 0) {
                    detectedTextEl.innerText = "即時識別文字：" + cleanText;
                } else {
                    detectedTextEl.innerText = "即時識別文字：(未偵測到文字)";
                }

                const expected = expectedInput.value.trim().toUpperCase();
                
                if (expected && cleanText.toUpperCase().includes(expected)) {
                    consecutivePassCount++;
                    if (consecutivePassCount >= 2) {
                        statusBox.className = "status-box pass";
                        statusBox.innerText = "【 PASS 】型號相符";
                    }
                } else {
                    consecutivePassCount = 0; 
                    statusBox.className = "status-box fail";
                    statusBox.innerText = "【 FAIL 】型號不符";
                }
            } catch (error) {
                console.error("OCR 錯誤:", error);
            } finally {
                isProcessing = false;
            }
        }

        window.onload = initOCR;
    </script>
</body>
</html>
