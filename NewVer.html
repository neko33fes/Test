<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中英文字檢測系統</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #121212; 
            color: #fff; 
            text-align: center; 
            margin: 0; 
            padding: 10px; 
        }
        h2 { margin: 10px 0; font-size: 20px; }
        .input-group { margin: 8px 0; }
        input[type="text"] { 
            padding: 10px; 
            font-size: 16px; 
            width: 80%; 
            max-width: 300px; 
            border-radius: 6px; 
            border: 1px solid #444; 
            background: #222; 
            color: #fff; 
            text-align: center; 
        }
        /* 後鏡頭切換按鈕樣式 */
        .switch-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin: 6px 0;
            transition: 0.2s;
        }
        .switch-btn:active {
            background: #555;
        }
        .video-container { 
            position: relative; 
            width: 100%; 
            max-width: 400px; 
            height: 240px; 
            margin: 10px auto; 
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #444;
            background: #000;
            cursor: pointer;
        }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
        }
        canvas { display: none; }
        .scan-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            transform: translateY(-50%);
            pointer-events: none;
            z-index: 10;
            background: repeating-linear-gradient(
                to right,
                #ff1744,
                #ff1744 12px,
                transparent 12px,
                transparent 24px
            );
        }
        .status-box { 
            margin: 15px auto; 
            padding: 16px; 
            max-width: 400px; 
            font-size: 22px; 
            font-weight: bold; 
            border-radius: 10px; 
            transition: 0.3s; 
        }
        .pending { background: #ef6c00; color: #fff; }
        .pass { background: #2e7d32; color: #fff; }
        .fail { background: #c62828; color: #fff; }
        p { font-size: 13px; color: #aaa; margin: 6px 0; }
    </style>
</head>
<body>

    <h2>中英文字檢測系統</h2>
    
    <div class="input-group">
        <label>比對文字：</label><br>
        <input type="text" id="expectedText" value="NE5532P">
    </div>

    <!-- 後鏡頭循環切換按鈕 -->
    <div>
        <button class="switch-btn" onclick="cycleBackCamera()">🔄 切換後置鏡頭 (<span id="camCount">1/1</span>)</button>
    </div>

    <div class="video-container" id="videoContainer">
        <video id="video" autoplay playsinline muted></video>
        <div class="scan-line"></div>
    </div>
    <canvas id="canvas"></canvas>

    <div id="statusBox" class="status-box pending">正在載入模型...</div>
    <p id="detectedText">識別文字：無</p>
    <p>（請將目標文字對準中央紅線，點擊按鈕可切換不同後鏡頭）</p>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusBox = document.getElementById('statusBox');
        const expectedInput = document.getElementById('expectedText');
        const videoContainer = document.getElementById('videoContainer');
        const detectedTextEl = document.getElementById('detectedText');
        const camCountEl = document.getElementById('camCount');

        let videoTrack = null;
        let worker = null;
        let isProcessing = false;
        let currentStream = null;

        let backCameras = [];
        let currentCamIndex = 0;

        async function initOCR() {
            try {
                statusBox.innerText = "載入中英文字型模型中...";
                worker = await Tesseract.createWorker(['eng', 'chi_tra']);
                await worker.setParameters({ tessedit_pageseg_mode: '7' });

                statusBox.className = "status-box pending";
                statusBox.innerText = "引擎就緒，正在偵測後置鏡頭...";
                
                await detectBackCameras();
            } catch (err) {
                statusBox.innerText = "引擎載入失敗";
                console.error(err);
            }
        }

        async function detectBackCameras() {
            try {
                const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
                tempStream.getTracks().forEach(track => track.stop());

                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');

                // 過濾出後置鏡頭
                backCameras = videoDevices.filter(device => {
                    const label = device.label.toLowerCase();
                    const isFront = label.includes('front') || label.includes('前') || label.includes('user');
                    return !isFront;
                });

                if (backCameras.length === 0) {
                    backCameras = videoDevices;
                }

                camCountEl.innerText = `1/${backCameras.length}`;
                
                if (backCameras.length > 0) {
                    await startCamera(backCameras[0].deviceId);
                } else {
                    await startCamera(null);
                }
            } catch (err) {
                console.error("無法偵測鏡頭", err);
                await startCamera(null);
            }
        }

        async function startCamera(deviceId) {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }

                const constraints = {
                    video: deviceId ? { 
                        deviceId: { exact: deviceId }, 
                        width: { ideal: 1280 }, 
                        height: { ideal: 720 } 
                    } : { 
                        facingMode: { exact: "environment" }, 
                        width: { ideal: 1280 }, 
                        height: { ideal: 720 } 
                    }
                };

                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: deviceId ? { deviceId: deviceId } : { facingMode: "environment" }
                    });
                }

                currentStream = stream;
                video.srcObject = stream;
                video.play();
                
                videoTrack = stream.getVideoTracks()[0];
                
                try {
                    const caps = videoTrack.getCapabilities();
                    if (caps.focusMode && caps.focusMode.includes('continuous')) {
                        await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                    }
                } catch (e) {}

                videoContainer.removeEventListener('click', triggerManualFocus);
                videoContainer.addEventListener('click', triggerManualFocus);

                if (!window.scanInterval) {
                    window.scanInterval = setInterval(processFrame, 2000);
                }
            } catch (err) {
                statusBox.innerText = "相機開啟失敗";
            }
        }

        async function cycleBackCamera() {
            if (backCameras.length <= 1) {
                alert("此裝置目前僅偵測到 1 個後置鏡頭可用");
                return;
            }

            currentCamIndex = (currentCamIndex + 1) % backCameras.length;
            camCountEl.innerText = `${currentCamIndex + 1}/${backCameras.length}`;
            
            statusBox.className = "status-box pending";
            statusBox.innerText = `已切換至後置鏡頭 #${currentCamIndex + 1}`;

            await startCamera(backCameras[currentCamIndex].deviceId);
        }

        async function processFrame() {
            if (!worker || isProcessing || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            isProcessing = true;

            try {
                const vW = video.videoWidth;
                const vH = video.videoHeight;
                const cH = videoContainer.clientHeight;
                
                const boxW = vW * 0.9;
                const boxH = (cH * 0.35) * (vH / cH);
                const boxX = (vW - boxW) / 2;
                const boxY = (vH - boxH) / 2;

                canvas.width = boxW;
                canvas.height = boxH;
                const ctx = canvas.getContext('2d');

                ctx.drawImage(video, boxX, boxY, boxW, boxH, 0, 0, boxW, boxH);

                let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    let avg = (data[i] * 0.3 + data[i + 1] * 0.59 + data[i + 2] * 0.11);
                    let val = avg < 120 ? 0 : 255;
                    data[i] = data[i+1] = data[i+2] = val;
                }
                ctx.putImageData(imgData, 0, 0);

                const { data: { text } } = await worker.recognize(canvas);
                const cleanText = text.replace(/[\s\r\n]+/g, '').trim();
                
                detectedTextEl.innerText = cleanText ? "識別文字：" + cleanText : "識別文字：(尋找中...)";

                const expected = expectedInput.value.replace(/[\s\r\n]+/g, '').trim().toUpperCase();
                const actual = cleanText.toUpperCase();

                if (expected && actual.includes(expected)) {
                    statusBox.className = "status-box pass";
                    statusBox.innerText = "【 PASS 】文字相符";
                } else {
                    statusBox.className = "status-box fail";
                    statusBox.innerText = "【 FAIL 】文字不符";
                }
            } catch (error) {
                console.error(error);
            } finally {
                isProcessing = false;
            }
        }

        async function triggerManualFocus() {
            if (!videoTrack) return;
            try {
                const caps = videoTrack.getCapabilities();
                if (caps.focusMode && caps.focusMode.includes('single-shot')) {
                    await videoTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
                    setTimeout(async () => {
                        await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                    }, 1000);
                }
            } catch (e) {}
        }

        window.onload = initOCR;
    </script>
</body>
</html>
