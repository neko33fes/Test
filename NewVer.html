<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>工業級行動即時文字比對系統</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: var(--bg-color, #404040);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            box-sizing: border-box;
            overflow: hidden;
            font-size: 2vh;
        }
        .wrapper {
            width: 100%;
            height: 100%;
            margin: 0 auto;
            padding: 6px 5%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 6px;
            position: relative;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            padding: 0 4px;
        }
        h2 {
            margin: 0;
            font-size: 1rem;
            color: var(--title-color, #ffffff);
        }
        .btn-group {
            display: flex;
            gap: 6px;
        }
        .config-btn {
            background: var(--btn-bg, #1a1a1a);
            color: var(--btn-text, #39c5bb);
            border: 2px solid var(--btn-border, #333333);
            padding: 4px 10px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .input-group {
            width: 100%;
            flex-shrink: 0;
        }
        input[type="text"].target-input {
            padding: 9px;
            font-size: 0.9rem;
            width: 100%;
            box-sizing: border-box;
            border-radius: 8px;
            border: 2px solid var(--input-border, #ffffff);
            background: var(--input-bg, #404040);
            color: var(--input-text, #ffffff);
            text-align: center;
            outline: none;
        }
        input[type="text"].target-input::placeholder {
            color: #aaaaaa;
        }
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(3px);
            z-index: 99;
            display: none;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 16px;
        }
        .modal-content {
            background: #404040;
            border: 2px solid #39c5bb;
            border-radius: 12px;
            width: 100%;
            max-width: 340px;
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            max-height: 90vh;
            overflow-y: auto;
            font-size: 0.75rem;
        }
        .modal-content h3 {
            margin: 0 0 2px 0;
            font-size: 0.95rem;
            text-align: center;
            color: #39c5bb;
        }
        .control-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .control-row label {
            font-size: 0.7rem;
            color: #dddddd;
        }
        .modal-content select {
            padding: 6px 8px;
            font-size: 0.8rem;
            border-radius: 6px;
            border: 2px solid #333333;
            background: #404040;
            color: #ffffff;
            text-align: center;
            outline: none;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
        }
        .modal-content input[type="color"] {
            -webkit-appearance: none;
            border: 2px solid #333333;
            border-radius: 6px;
            width: 100%;
            height: 36px;
            background: #404040;
            cursor: pointer;
            padding: 2px;
            box-sizing: border-box;
        }
        .modal-content input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        .modal-content input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 4px;
        }
        .close-modal-btn {
            margin-top: 4px;
            background: #39c5bb;
            color: #000000;
            border: none;
            padding: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }
        .video-container {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 0;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--video-border, rgba(255, 255, 255, 0.25));
            background: #404040;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-wrapper-inner {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
            transition: transform 0.2s ease;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        canvas {
            display: none;
        }
        .scan-box {
            position: absolute;
            width: var(--box-size, 50%);
            height: var(--box-size, 50%);
            border: 2px solid var(--scanbox-color, rgba(57, 197, 187, 0.5));
            box-sizing: border-box;
            pointer-events: none;
            border-radius: 8px;
            transition: width 0.1s ease, height 0.1s ease;
            z-index: 10;
        }
        .status-box {
            padding: 10px;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .pending { background: var(--pending-bg, #ef6c00); color: var(--pending-text, #ffffff); }
        .pass { background: var(--pass-bg, #2e7d32); color: var(--pass-text, #ffffff); }
        .fail { background: var(--fail-bg, #c62828); color: var(--fail-text, #ffffff); }
    </style>
</head>
<body style="background: #404040;">
    <div class="wrapper">
        <div class="header-bar">
            <h2>文字比對系統</h2>
            <div class="btn-group">
                <button class="config-btn" onclick="toggleModal('settingsModal', true)">設定</button>
                <button class="config-btn" onclick="toggleModal('colorModal', true)">顏色</button>
            </div>
        </div>
        <div class="input-group">
            <input type="text" id="expectedText" class="target-input" placeholder="請輸入欲檢核的特定文字" value="">
        </div>

        <!-- 設定面板 -->
        <div id="settingsModal" class="modal-overlay">
            <div class="modal-content">
                <h3>系統參數設定</h3>
                <div class="control-row">
                    <label>掃描頻率</label>
                    <select id="intervalSelect" onchange="changeInterval(this)">
                        <option value="1">1.0 秒</option>
                        <option value="2">2.0 秒</option>
                        <option value="2.5" selected>2.5 秒 (預設)</option>
                        <option value="3">3.0 秒</option>
                        <option value="5">5.0 秒</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>檢測框大小基準</label>
                    <select id="boxSelect" onchange="changeScanBoxSize(this)">
                        <option value="1.0">100% 框</option>
                        <option value="0.75">75% 框</option>
                        <option value="0.5" selected>50% 框 (預設)</option>
                        <option value="0.25">25% 框</option>
                        <option value="0.1">10% 框</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>畫面放大倍率 (全縮放連動)</label>
                    <select id="zoomSelect" onchange="changeZoom(this)">
                        <option value="1" selected>1x (正常)</option>
                        <option value="2">2x 放大</option>
                        <option value="5">5x 放大</option>
                        <option value="10">10x 放大</option>
                    </select>
                </div>
                <button class="close-modal-btn" onclick="toggleModal('settingsModal', false)">確定 / 關閉</button>
            </div>
        </div>

        <!-- 顏色面板 -->
        <div id="colorModal" class="modal-overlay">
            <div class="modal-content">
                <h3>顏色設定</h3>
                <div class="control-row">
                    <label>網頁背景色</label>
                    <input type="color" id="bgColorInput" value="#404040" oninput="updateColorVar('--bg-color', this, true)">
                </div>
                <div class="control-row">
                    <label>系統標題文字顏色</label>
                    <input type="color" id="titleColorInput" value="#ffffff" oninput="updateColorVar('--title-color', this)">
                </div>
                <div class="control-row">
                    <label>按鈕背景色</label>
                    <input type="color" id="btnBgInput" value="#1a1a1a" oninput="updateColorVar('--btn-bg', this)">
                </div>
                <div class="control-row">
                    <label>按鈕文字顏色</label>
                    <input type="color" id="btnTextInput" value="#39c5bb" oninput="updateColorVar('--btn-text', this)">
                </div>
                <div class="control-row">
                    <label>按鈕外框顏色</label>
                    <input type="color" id="btnBorderInput" value="#333333" oninput="updateColorVar('--btn-border', this)">
                </div>
                <div class="control-row">
                    <label>目標輸入框背景色</label>
                    <input type="color" id="inputBgInput" value="#404040" oninput="updateColorVar('--input-bg', this)">
                </div>
                <div class="control-row">
                    <label>目標輸入框文字顏色</label>
                    <input type="color" id="inputTextInput" value="#ffffff" oninput="updateColorVar('--input-text', this)">
                </div>
                <div class="control-row">
                    <label>目標輸入框外框顏色</label>
                    <input type="color" id="inputBorderInput" value="#ffffff" oninput="updateColorVar('--input-border', this)">
                </div>
                <div class="control-row">
                    <label>相機預覽區外框顏色</label>
                    <input type="color" id="videoBorderInput" value="#ffffff" oninput="updateColorVar('--video-border', this)">
                </div>
                <div class="control-row">
                    <label>中央檢測框顏色</label>
                    <input type="color" id="scanBoxColorInput" value="#39c5bb" oninput="updateScanBoxColor(this)">
                </div>
                <div class="control-row">
                    <label>PASS 狀態背景色</label>
                    <input type="color" id="passBgInput" value="#2e7d32" oninput="updateColorVar('--pass-bg', this)">
                </div>
                <div class="control-row">
                    <label>FAIL 狀態背景色</label>
                    <input type="color" id="failBgInput" value="#c62828" oninput="updateColorVar('--fail-bg', this)">
                </div>
                <div class="control-row">
                    <label>檢核中狀態背景色</label>
                    <input type="color" id="pendingBgInput" value="#ef6c00" oninput="updateColorVar('--pending-bg', this)">
                </div>
                <div class="control-row">
                    <label>狀態列文字顏色</label>
                    <input type="color" id="statusTextInput" value="#ffffff" oninput="updateColorVar('--pending-text', this); updateColorVar('--pass-text', this); updateColorVar('--fail-text', this);">
                </div>
                <button class="close-modal-btn" onclick="toggleModal('colorModal', false)">確定 / 關閉</button>
            </div>
        </div>

        <div class="video-container" id="videoContainer">
            <div class="video-wrapper-inner" id="videoWrapper">
                <video id="video" autoplay playsinline muted></video>
            </div>
            <div id="scanBox" class="scan-box" style="--box-size: 50%;"></div>
        </div>
        <canvas id="canvas"></canvas>
        <div id="statusBox" class="status-box pending">正在載入模型...</div>
    </div>
    <script>
        const video = document.getElementById('video');
        const videoWrapper = document.getElementById('videoWrapper');
        const canvas = document.getElementById('canvas');
        const statusBox = document.getElementById('statusBox');
        const expectedInput = document.getElementById('expectedText');
        const scanBox = document.getElementById('scanBox');
        const bgColorInput = document.getElementById('bgColorInput');
        const inputBgInput = document.getElementById('inputBgInput');
        let videoTrack = null;
        let worker = null;
        let isProcessing = false;
        let scanTimer = null;
        let currentInterval = 2.5;
        let baseBoxScale = 0.5;
        let currentZoom = 1;
        let failCount = 0;
        const requiredFailCount = 2;
        const rotCanvas = document.createElement('canvas');
        const rotCtx = rotCanvas.getContext('2d');

        function toggleModal(modalId, show) {
            document.getElementById(modalId).style.display = show ? 'flex' : 'none';
        }
        function updateColorVar(variableName, inputObj, isBodyBackground = false) {
            let color = inputObj.value;
            document.documentElement.style.setProperty(variableName, color);
            if (isBodyBackground) {
                document.body.style.background = color;
            }
        }
        function updateScanBoxColor(inputObj) {
            let color = inputObj.value;
            let r = parseInt(color.slice(1, 3), 16);
            let g = parseInt(color.slice(3, 5), 16);
            let b = parseInt(color.slice(5, 7), 16);
            scanBox.style.setProperty('--scanbox-color', `rgba(${r}, ${g}, ${b}, 0.5)`);
        }
        function changeScanBoxSize(selectObj) {
            baseBoxScale = parseFloat(selectObj.value);
            updateScanBoxDisplay();
        }
        function changeInterval(selectObj) {
            currentInterval = parseFloat(selectObj.value);
            failCount = 0;
            restartScanLoop();
        }
        function changeZoom(selectObj) {
            const zoomLevel = parseFloat(selectObj.value);
            currentZoom = zoomLevel;
            videoWrapper.style.transform = `scale(${zoomLevel})`;
            updateScanBoxDisplay();
        }
        function updateScanBoxDisplay() {
            const effectiveScale = baseBoxScale / currentZoom;
            scanBox.style.setProperty('--box-size', (effectiveScale * 100) + '%');
        }
        async function initOCR() {
            try {
                statusBox.innerText = "載入中英文字型模型中...";
                worker = await Tesseract.createWorker(['eng', 'chi_tra']);
                statusBox.className = "status-box pending";
                statusBox.innerText = "引擎就緒，請輸入確認文字";
                await startCamera();
                restartScanLoop();
            } catch (err) {
                statusBox.innerText = "引擎載入失敗";
                console.error(err);
            }
        }
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
                }).catch(() => navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }));
                video.srcObject = stream;
                video.play();
                videoTrack = stream.getVideoTracks()[0];
                
                // 相機成功啟動後，自動將背景色與輸入框背景切換為 5% 黑 (#0f0f0f)
                const activeColor = "#0f0f0f";
                document.documentElement.style.setProperty('--bg-color', activeColor);
                document.documentElement.style.setProperty('--input-bg', activeColor);
                document.body.style.background = activeColor;
                bgColorInput.value = activeColor;
                inputBgInput.value = activeColor;

                try {
                    const caps = videoTrack.getCapabilities();
                    if (caps.focusMode && caps.focusMode.includes('continuous')) {
                        await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                    }
                } catch (e) {}
            } catch (err) {
                statusBox.innerText = "相機開啟失敗";
            }
        }
        function restartScanLoop() {
            if (scanTimer) {
                clearTimeout(scanTimer);
                scanTimer = null;
            }
            const runLoop = async () => {
                await processFrame();
                scanTimer = setTimeout(runLoop, currentInterval * 1000);
            };
            scanTimer = setTimeout(runLoop, currentInterval * 1000);
        }
        async function processFrame() {
            if (!worker || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            if (isProcessing) return;
            const expected = expectedInput.value.replace(/[\s\r\n]+/g, '').trim().toUpperCase();
            if (!expected) {
                statusBox.className = "status-box pending";
                statusBox.innerText = "請於上方輸入確認文字";
                failCount = 0;
                return;
            }
            isProcessing = true;
            const safetyTimeout = setTimeout(() => {
                if (isProcessing) isProcessing = false;
            }, 8000);
            try {
                const vW = video.videoWidth, vH = video.videoHeight;
                const effectiveScale = baseBoxScale / currentZoom;
                const boxW = vW * effectiveScale;
                const boxH = vH * effectiveScale;
                const boxX = (vW - boxW) / 2;
                const boxY = (vH - boxH) / 2;
                canvas.width = boxW; 
                canvas.height = boxH;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, boxX, boxY, boxW, boxH, 0, 0, boxW, boxH);
                const angles = [0, 90, 180, 270];
                let matched = false;
                for (let angle of angles) {
                    let targetCanvas = canvas;
                    if (angle !== 0) {
                        const isSwap = (angle === 90 || angle === 270);
                        rotCanvas.width = isSwap ? boxH : boxW;
                        rotCanvas.height = isSwap ? boxW : boxH;
                        rotCtx.clearRect(0, 0, rotCanvas.width, rotCanvas.height);
                        rotCtx.save();
                        rotCtx.translate(rotCanvas.width / 2, rotCanvas.height / 2);
                        rotCtx.rotate((angle * Math.PI) / 180);
                        rotCtx.drawImage(canvas, -boxW / 2, -boxH / 2);
                        rotCtx.restore();
                        targetCanvas = rotCanvas;
                    }
                    const { data: { text } } = await worker.recognize(targetCanvas);
                    const cleanText = text.replace(/[\s\r\n]+/g, '').trim().toUpperCase();
                    if (cleanText.includes(expected)) {
                        matched = true;
                        break; 
                    }
                }
                if (matched) {
                    failCount = 0;
                    statusBox.className = "status-box pass";
                    statusBox.innerText = "【 PASS 】文字相符";
                } else {
                    failCount++;
                    if (failCount >= requiredFailCount) {
                        statusBox.className = "status-box fail";
                        statusBox.innerText = "【 FAIL 】文字不符";
                    } else {
                        statusBox.className = "status-box pending";
                        statusBox.innerText = "【 檢核中... 】再次確認中";
                    }
                }
            } catch (error) {
                console.error(error);
            } finally {
                clearTimeout(safetyTimeout);
                isProcessing = false;
            }
        }
        window.onload = initOCR;
    </script>
</body>
</html>
