<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IC 即時自動檢測 App (對焦加速版)</title>
    <!-- 引入 Tesseract.js -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #121212; 
            color: #fff; 
            text-align: center; 
            margin: 0; 
            padding: 10px; 
        }
        h2 { margin: 10px 0; font-size: 22px; }
        .input-group { margin: 8px 0; }
        input { 
            padding: 10px; 
            font-size: 18px; 
            width: 80%; 
            max-width: 300px; 
            border-radius: 6px; 
            border: 1px solid #444; 
            background: #222; 
            color: #fff; 
            text-align: center; 
        }
        .video-container { 
            position: relative; 
            width: 100%; 
            max-width: 400px; 
            margin: 10px auto; 
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #444;
            background: #000;
            cursor: pointer;
        }
        video { width: 100%; display: block; }
        canvas { display: none; }
        
        /* 扁平長條型取景對齊框 */
        .scan-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;   
            height: 60px; 
            border: 2px dashed #00e676;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            border-radius: 6px;
        }
        .scan-box::after {
            content: "請將 IC 刻字置於框內 (點擊畫面瞬間對焦)";
            position: absolute;
            bottom: -24px;
            left: 0;
            right: 0;
            font-size: 11px;
            color: #00e676;
            text-align: center;
            white-space: nowrap;
        }

        /* 點擊畫面時的對焦框特效 */
        .focus-ring {
            position: absolute;
            width: 140px; 
            height: 50px; 
            border: 2px solid #ffeb3b;
            border-radius: 6px;
            transform: translate(-50%, -50%) scale(1.1);
            pointer-events: none;
            opacity: 0;
            transition: transform 0.15s, opacity 0.15s;
        }
        .focus-ring.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .status-box { 
            margin: 15px auto; 
            padding: 18px; 
            max-width: 400px; 
            font-size: 24px; 
            font-weight: bold; 
            border-radius: 10px; 
            transition: 0.3s; 
        }
        .pending { background: #ef6c00; color: #fff; }
        .pass { background: #2e7d32; color: #fff; }
        .fail { background: #c62828; color: #fff; }
        p { font-size: 14px; color: #aaa; margin: 6px 0; }
    </style>
</head>
<body>

    <h2>IC 表面文字即時檢測系統</h2>
    
    <div class="input-group">
        <label>預期型號：</label><br>
        <input type="text" id="expectedText" value="NE5532P">
    </div>

    <!-- 相機與對齊框 -->
    <div class="video-container" id="videoContainer">
        <video id="video" autoplay playsinline muted></video>
        <div class="scan-box"></div>
        <div id="focusRing" class="focus-ring"></div>
    </div>
    <canvas id="canvas"></canvas>

    <!-- 狀態顯示 -->
    <div id="statusBox" class="status-box pending">載入辨識引擎中...</div>
    <p id="detectedText">即時識別文字：無</p>
    <p>（請將 IC 靠近鏡頭對準框內，若未對焦請點擊畫面加速對焦）</p>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusBox = document.getElementById('statusBox');
        const detectedTextEl = document.getElementById('detectedText');
        const expectedInput = document.getElementById('expectedText');
        const videoContainer = document.getElementById('videoContainer');
        const focusRing = document.getElementById('focusRing');

        let worker = null;
        let isProcessing = false;
        let consecutivePassCount = 0; 
        let videoTrack = null;

        // 初始化 Tesseract Worker
        async function initOCR() {
            try {
                worker = await Tesseract.createWorker('eng');
                await worker.setParameters({
                    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-',
                });
                statusBox.className = "status-box pending";
                statusBox.innerText = "引擎就緒，等待對準 IC";
                startCamera();
            } catch (err) {
                console.error(err);
                statusBox.innerText = "OCR 引擎載入失敗";
            }
        }

        // 啟動相機並加入對焦加速與微距設定
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: { exact: "environment" },
                        // 使用較高畫質以利清晰辨識微小刻字
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        // 強制請求連續自動對焦
                        focusMode: "continuous"
                    }
                }).catch(() => {
                    return navigator.mediaDevices.getUserMedia({ video: true });
                });

                video.srcObject = stream;
                video.play();
                
                videoTrack = stream.getVideoTracks()[0];
                
                // 套用高階對焦加速與曝光鎖定
                await applyFastFocusSettings(videoTrack);

                // 綁定點擊畫面瞬間對焦事件
                videoContainer.addEventListener('click', (e) => triggerFastManualFocus(e));

                // 提高辨識反應速度（每 1.5 秒執行一次，兼顧流暢與效能）
                setInterval(processFrame, 1500); 
            } catch (err) {
                alert("無法開啟相機，請檢查瀏覽器權限或確認是否使用 HTTPS/Localhost！");
                statusBox.innerText = "相機開啟失敗";
            }
        }

        // 嘗試套用硬體加速對焦設定
        async function applyFastFocusSettings(track) {
            try {
                const capabilities = track.getCapabilities();
                let advancedSettings = {};

                // 優先啟用連續對焦或微距模式，加速鏡頭鎖定
                if (capabilities.focusMode) {
                    if (capabilities.focusMode.includes('continuous')) {
                        advancedSettings.focusMode = 'continuous';
                    } else if (capabilities.focusMode.includes('macro')) {
                        advancedSettings.focusMode = 'macro';
                    }
                }

                // 若支援曝光補償，微調曝光以減少金屬 IC 反光
                if (capabilities.exposureCompensation) {
                    advancedSettings.exposureCompensation = 0; 
                }

                if (Object.keys(advancedSettings).length > 0) {
                    await track.applyConstraints({ advanced: [advancedSettings] });
                    console.log("已套用對焦加速設定", advancedSettings);
                }
            } catch (err) {
                console.log("硬體不支援進階對焦約束，使用預設加速模式", err);
            }
        }

        // 點擊畫面強制執行單次極速對焦 (Single-shot Focus)
        async function triggerFastManualFocus(e) {
            if (!videoTrack) return;

            const rect = videoContainer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // 顯示對焦黃框動畫
            focusRing.style.left = `${x}px`;
            focusRing.style.top = `${y}px`;
            focusRing.classList.add('active');
            setTimeout(() => {
                focusRing.classList.remove('active');
            }, 300);

            // 嘗試透過硬體強制觸發單次對焦以達到瞬間清晰
            try {
                const capabilities = videoTrack.getCapabilities();
                if (capabilities.focusMode && capabilities.focusMode.includes('single-shot')) {
                    await videoTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
                    // 1 秒後恢復連續對焦，確保後續移動時能持續跟焦
                    setTimeout(async () => {
                        await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                    }, 1000);
                }
            } catch (err) {
                console.log("手動極速對焦觸發受限於當前瀏覽器環境", err);
            }
        }

        // 截取扁平長條框區域並進行影像前處理
        function captureAndPreprocess() {
            const ctx = canvas.getContext('2d');
            const vWidth = video.videoWidth;
            const vHeight = video.videoHeight;

            if (!vWidth || !vHeight) return false;

            const boxWidth = vWidth * 0.85;
            const boxHeight = 60; 
            const boxX = (vWidth - boxWidth) / 2;
            const boxY = (vHeight - boxHeight) / 2;

            canvas.width = boxWidth;
            canvas.height = boxHeight;

            ctx.drawImage(video, boxX, boxY, boxWidth, boxHeight, 0, 0, boxWidth, boxHeight);

            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imgData.data;
            
            const contrast = 1.5; 
            const intercept = 128 * (1 - contrast);

            for (let i = 0; i < data.length; i += 4) {
                let avg = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114); 
                let cVal = avg * contrast + intercept; 
                cVal = cVal < 40 ? 0 : (cVal > 220 ? 255 : cVal); 

                data[i] = cVal;     
                data[i + 1] = cVal; 
                data[i + 2] = cVal; 
            }
            ctx.putImageData(imgData, 0, 0);
            return true;
        }

        // 執行辨識主邏輯
        async function processFrame() {
            if (!worker || isProcessing || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            
            isProcessing = true;

            try {
                if (!captureAndPreprocess()) {
                    isProcessing = false;
                    return;
                }

                const { data: { text } } = await worker.recognize(canvas);
                const cleanText = text.replace(/[^A-Z0-9-]/g, '').trim(); 
                
                if (cleanText.length > 0) {
                    detectedTextEl.innerText = "即時識別文字：" + cleanText;
                }

                const expected = expectedInput.value.trim().toUpperCase();
                
                if (expected && cleanText.includes(expected)) {
                    consecutivePassCount++;
                    if (consecutivePassCount >= 2) {
                        statusBox.className = "status-box pass";
                        statusBox.innerText = "【 PASS 】型號相符";
                    }
                } else {
                    consecutivePassCount = 0; 
                    statusBox.className = "status-box fail";
                    statusBox.innerText = "【 FAIL 】型號不符";
                }
            } catch (error) {
                console.error("OCR 錯誤:", error);
            } finally {
                isProcessing = false;
            }
        }

        window.onload = initOCR;
    </script>
</body>
</html>
