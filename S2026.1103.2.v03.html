<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IC 即時檢測 App (具黃框開關版)</title>
    <!-- 引入 Tesseract.js 文字辨識庫 -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #121212; 
            color: #fff; 
            text-align: center; 
            margin: 0; 
            padding: 10px; 
        }
        h2 { margin: 10px 0; font-size: 20px; }
        .input-group { margin: 8px 0; }
        input[type="text"] { 
            padding: 10px; 
            font-size: 16px; 
            width: 80%; 
            max-width: 300px; 
            border-radius: 6px; 
            border: 1px solid #444; 
            background: #222; 
            color: #fff; 
            text-align: center; 
        }
        .checkbox-group {
            margin: 8px 0;
            font-size: 14px;
            color: #ccc;
            cursor: pointer;
        }
        .checkbox-group input {
            transform: scale(1.2);
            margin-right: 6px;
            cursor: pointer;
        }

        /* 具備響應式適應力的相機預覽框 */
        .video-container { 
            position: relative; 
            width: 100%; 
            max-width: 400px; 
            height: 240px; 
            margin: 10px auto; 
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #444;
            background: #000;
            cursor: pointer;
        }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
        }
        canvas { display: none; }
        
        /* 透過百分比置中對齊的基準紅線 */
        .scan-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            transform: translateY(-50%);
            pointer-events: none;
            z-index: 10;
            background: repeating-linear-gradient(
                to right,
                #ff1744,
                #ff1744 12px,
                transparent 12px,
                transparent 24px
            );
        }

        /* 黃色虛線框：預設隱藏 (display: none)，勾選後顯示 */
        .capture-box {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 40px; /* 掃描帶高度 */
            transform: translateY(-50%);
            border: 2px dashed #ffeb3b; /* 黃色虛線 */
            pointer-events: none;
            z-index: 9;
            box-sizing: border-box;
            background-color: rgba(255, 235, 59, 0.05);
            display: none; /* 預設 OFF */
        }

        /* 狀態看板樣式 */
        .status-box { 
            margin: 15px auto; 
            padding: 16px; 
            max-width: 400px; 
            font-size: 22px; 
            font-weight: bold; 
            border-radius: 10px; 
            transition: 0.3s; 
        }
        .pending { background: #ef6c00; color: #fff; }
        .pass { background: #2e7d32; color: #fff; }
        .fail { background: #c62828; color: #fff; }
        p { font-size: 13px; color: #aaa; margin: 6px 0; }
    </style>
</head>
<body>

    <h2>IC 即時檢測系統</h2>
    
    <div class="input-group">
        <label>預期型號/文字：</label><br>
        <input type="text" id="expectedText" value="NE5532P">
    </div>

    <!-- 黃框顯示開關 (預設 OFF) -->
    <div class="checkbox-group">
        <label>
            <input type="checkbox" id="showBoxToggle"> 顯示黃色擷取範圍框
        </label>
    </div>

    <!-- 相機與掃描框 -->
    <div class="video-container" id="videoContainer">
        <video id="video" autoplay playsinline muted></video>
        <div class="capture-box" id="captureBox"></div>
        <div class="scan-line"></div>
    </div>
    <canvas id="canvas"></canvas>

    <!-- 狀態顯示 -->
    <div id="statusBox" class="status-box pending">正在載入中英文字型模型...</div>
    <p id="detectedText">識別文字：無</p>
    <p>（請將 IC 字體對準紅線，系統將自動適應不同手機進行裁切辨識）</p>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusBox = document.getElementById('statusBox');
        const expectedInput = document.getElementById('expectedText');
        const videoContainer = document.getElementById('videoContainer');
        const detectedTextEl = document.getElementById('detectedText');
        const showBoxToggle = document.getElementById('showBoxToggle');
        const captureBox = document.getElementById('captureBox');

        let videoTrack = null;
        let worker = null;
        let isProcessing = false;

        // 監聽黃框開關切換
        showBoxToggle.addEventListener('change', (e) => {
            if (e.target.checked) {
                captureBox.style.display = 'block';
            } else {
                captureBox.style.display = 'none';
            }
        });

        // 初始化 Tesseract AI 辨識引擎
        async function initOCR() {
            try {
                statusBox.innerText = "載入中英文字型模型中 (初次需下載，請稍候)...";
                worker = await Tesseract.createWorker(['eng', 'chi_tra']);
                statusBox.className = "status-box pending";
                statusBox.innerText = "引擎就緒，請對準 IC";
                startCamera();
            } catch (err) {
                statusBox.innerText = "辨識引擎載入失敗";
                console.error(err);
            }
        }

        // 啟動手機相機
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: { exact: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        focusMode: "continuous"
                    }
                }).catch(() => {
                    return navigator.mediaDevices.getUserMedia({ video: true });
                });

                video.srcObject = stream;
                video.play();
                
                videoTrack = stream.getVideoTracks()[0];
                await applyFastFocusSettings(videoTrack);

                videoContainer.addEventListener('click', () => triggerFastManualFocus());

                // 每 2.5 秒自動執行適應性畫面裁切與辨識
                setInterval(processFrame, 2500);
            } catch (err) {
                alert("無法開啟相機，請檢查瀏覽器權限或確認是否使用 HTTPS！");
                statusBox.innerText = "相機開啟失敗";
            }
        }

        // 核心：基於比例的適應性裁剪演算法
        async function processFrame() {
            if (!worker || isProcessing || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            
            isProcessing = true;

            try {
                const vWidth = video.videoWidth;   // 相機感光元件真實寬度
                const vHeight = video.videoHeight; // 相機感光元件真實高度

                const uiBoxHeightPx = 40; 
                const containerHeight = videoContainer.clientHeight;

                const boxW = vWidth;
                const boxH = uiBoxHeightPx * (vHeight / containerHeight);
                const boxX = 0;
                const boxY = (vHeight - boxH) / 2;

                canvas.width = boxW * 2;   
                canvas.height = boxH * 2;
                const ctx = canvas.getContext('2d');

                ctx.drawImage(video, boxX, boxY, boxW, boxH, 0, 0, canvas.width, canvas.height);

                // 執行辨識
                const { data: { text } } = await worker.recognize(canvas);
                const cleanText = text.replace(/[\s\r\n]+/g, '').trim();
                
                if (cleanText) {
                    detectedTextEl.innerText = "識別文字：" + cleanText;
                } else {
                    detectedTextEl.innerText = "識別文字：(尋找中...)";
                }

                const expected = expectedInput.value.replace(/[\s\r\n]+/g, '').trim().toUpperCase();
                const actual = cleanText.toUpperCase();
                
                // 比對結果判定 PASS / FAIL
                if (expected && actual.includes(expected)) {
                    statusBox.className = "status-box pass";
                    statusBox.innerText = "【 PASS 】文字相符";
                } else {
                    statusBox.className = "status-box fail";
                    statusBox.innerText = "【 FAIL 】文字不符";
                }
            } catch (error) {
                console.error(error);
            } finally {
                isProcessing = false;
            }
        }

        // 相機自動對焦設定
        async function applyFastFocusSettings(track) {
            try {
                const capabilities = track.getCapabilities();
                if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
                    await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                }
            } catch (err) {
                console.log("不支援進階對焦", err);
            }
        }

        // 點擊畫面單次極速對焦
        async function triggerFastManualFocus() {
            if (!videoTrack) return;
            try {
                const capabilities = videoTrack.getCapabilities();
                if (capabilities.focusMode && capabilities.focusMode.includes('single-shot')) {
                    await videoTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
                    setTimeout(async () => {
                        await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                    }, 1000);
                }
            } catch (err) {
                console.log("手動對焦受限", err);
            }
        }

        window.onload = initOCR;
    </script>
</body>
</html>
